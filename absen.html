<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Hadir — Konsolidasi Organisasi</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: { 50:'#EEF4FF', 100:'#D9E6FF', 200:'#BCCFFF', 400:'#5B8DEF', 500:'#3366CC', 600:'#1A4FA0', 700:'#0E3B7A' },
                    ok:    { 50:'#ECFDF5', 100:'#D1FAE5', 400:'#34D399', 500:'#10B981', 600:'#059669' },
                    warn:  { 50:'#FFFBEB', 100:'#FEF3C7', 400:'#FBBF24', 500:'#F59E0B' },
                    err:   { 50:'#FEF2F2', 500:'#EF4444' },
                },
                fontFamily: {
                    display: ['Playfair Display','serif'],
                    sans: ['DM Sans','sans-serif']
                }
            }
        }
    }
    </script>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
        body{font-family:'DM Sans',sans-serif;background:#F8FAFC;color:#1E293B;min-height:100dvh;overflow-x:hidden}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
        .scan-field{transition:all .2s}
        .scan-field:focus-within{box-shadow:0 0 0 3px rgba(51,102,204,.18),0 4px 20px rgba(51,102,204,.08)}
        .scan-field.s-processing{box-shadow:0 0 0 3px rgba(245,158,11,.25);border-color:#FBBF24}
        .scan-field.s-success{box-shadow:0 0 0 3px rgba(16,185,129,.2);border-color:#10B981}
        .scan-field.s-error{box-shadow:0 0 0 3px rgba(239,68,68,.2);border-color:#EF4444}
        .scan-field.s-warning{box-shadow:0 0 0 3px rgba(245,158,11,.2);border-color:#F59E0B}
        .card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;transition:all .2s}
        .result-panel{transition:all .3s cubic-bezier(.4,0,.2,1);max-height:0;opacity:0;overflow:hidden}
        .result-panel.show{max-height:500px;opacity:1}
        .toast-in{animation:tIn .3s cubic-bezier(.34,1.56,.64,1)}
        .toast-out{animation:tOut .2s ease forwards}
        @keyframes tIn{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
        @keyframes tOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.9)}}
        .log-in{animation:lIn .25s ease}
        @keyframes lIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
        .tab-btn{transition:all .2s;position:relative}
        .tab-btn::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:2px;background:#3366CC;border-radius:2px;transition:all .2s;transform:translateX(-50%)}
        .tab-btn.active::after{width:60%}
        .tab-btn.active{color:#3366CC;font-weight:600}
        .scanner-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000}
        #reader{border-radius:14px;overflow:hidden}
        #reader video{border-radius:14px}
        .vf-corner{position:absolute;width:22px;height:22px;border-color:#3366CC;border-style:solid;z-index:10;pointer-events:none}
        .vf-tl{top:8%;left:8%;border-width:3px 0 0 3px;border-radius:3px 0 0 0}
        .vf-tr{top:8%;right:8%;border-width:3px 3px 0 0;border-radius:0 3px 0 0}
        .vf-bl{bottom:8%;left:8%;border-width:0 0 3px 3px;border-radius:0 0 0 3px}
        .vf-br{bottom:8%;right:8%;border-width:0 3px 3px 0;border-radius:0 0 3px 0}
        .scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#3366CC,transparent);z-index:10;pointer-events:none;animation:scanL 2s ease-in-out infinite}
        @keyframes scanL{0%{top:8%;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:87%;opacity:0}}
        mark{background:#D9E6FF;color:#1A4FA0;padding:1px 2px;border-radius:2px}
        input:focus{outline:none}
        .scan-ready-dot{width:6px;height:6px;border-radius:50%;background:#3366CC;animation:blink 1.5s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
</head>
<body>

<!-- Loader awal -->
<div id="loader" class="fixed inset-0 z-[70] bg-[#F8FAFC]/90 backdrop-blur-sm flex items-center justify-center transition-opacity duration-300">
    <div class="bg-white border border-slate-200 rounded-2xl px-6 py-4 shadow-xl flex items-center gap-3">
        <i class="fas fa-circle-notch fa-spin text-brand-500 text-lg"></i>
        <span class="text-sm font-semibold text-slate-700">Memuat data…</span>
    </div>
</div>

<main class="max-w-lg mx-auto px-4 pt-4 pb-20">

    <header class="text-center mb-3">
        <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-500 text-white mb-1.5 shadow-md shadow-brand-500/20">
            <i class="fas fa-landmark text-sm"></i>
        </div>
        <h1 class="font-display text-lg font-black tracking-tight text-slate-900">Daftar Hadir</h1>
        <p class="text-brand-500 font-semibold text-xs">Konsolidasi Organisasi</p>
    </header>

    <!-- Pengaturan Waktu Terpusat -->
    <div class="bg-white rounded-xl p-2.5 mb-2.5 border border-slate-200 shadow-sm flex items-center justify-between text-xs">
        <div>
            <span class="font-bold text-slate-700 block">Jam Terakhir / Acara Mulai</span>
            <span class="text-slate-400 text-[10px]" id="config-status-label">Sinkron dari Cloud</span>
        </div>
        <div class="flex items-center gap-1.5">
            <input type="time" id="target-time" value="08:00" onchange="konfirmasiUbahWaktu(this.value)" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 font-bold text-slate-800 text-sm focus:border-brand-500">
        </div>
    </div>

    <!-- Statistik Ringkas -->
    <div class="grid grid-cols-4 gap-2 mb-2">
        <div class="bg-white rounded-xl p-2 text-center border border-slate-100 shadow-sm">
            <div id="stat-total" class="text-base font-bold text-brand-500">-</div>
            <div class="text-[8px] text-slate-400 uppercase tracking-wider">Terdaftar</div>
        </div>
        <div class="bg-white rounded-xl p-2 text-center border border-slate-100 shadow-sm">
            <div id="stat-hadir" class="text-base font-bold text-ok-500">-</div>
            <div class="text-[8px] text-slate-400 uppercase tracking-wider">Hadir</div>
        </div>
        <div class="bg-white rounded-xl p-2 text-center border border-slate-100 shadow-sm">
            <div id="stat-belum" class="text-base font-bold text-rose-500">-</div>
            <div class="text-[8px] text-slate-400 uppercase tracking-wider">Belum</div>
        </div>
        <div class="bg-white rounded-xl p-2 text-center border border-slate-100 shadow-sm">
            <div id="stat-persen" class="text-base font-bold text-slate-700">-</div>
            <div class="text-[8px] text-slate-400 uppercase tracking-wider">Persen</div>
        </div>
    </div>

    <div class="w-full h-1.5 bg-slate-100 rounded-full mb-1.5 overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-brand-500 to-ok-500 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>

    <!-- Indikator Live Sync -->
    <div class="flex items-center justify-center gap-1.5 mb-3 text-[10px] text-slate-400">
        <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
        <span id="sync-label">Menyambung ke cloud…</span>
    </div>

    <!-- Scan Barcode -->
    <section id="section-scan" class="mb-3">
        <div class="scan-field bg-white border-2 border-brand-200 rounded-2xl p-1 shadow-lg shadow-brand-500/8" id="scan-field-wrap">
            <div class="flex items-center gap-2 px-3">
                <div class="w-8 h-8 rounded-xl bg-brand-500 flex items-center justify-center shrink-0">
                    <i class="fas fa-barcode text-white text-xs"></i>
                </div>
                <input type="text" id="scan-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                       placeholder="Scan / ketik ID di sini..."
                       class="flex-1 py-2.5 text-sm font-semibold text-slate-800 placeholder-slate-400 bg-transparent border-none focus:ring-0 focus:outline-none"
                       onkeydown="handleScanKey(event)"
                       oninput="handleScanInput()">
                <div id="scan-status" class="shrink-0 flex items-center gap-1.5">
                    <span class="text-[9px] text-brand-500 font-bold bg-brand-50 px-1.5 py-0.5 rounded">AUTO</span>
                    <div class="scan-ready-dot" id="scan-ready-dot"></div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between mt-2 mb-2 px-1">
            <button onclick="loadData()" class="text-xs text-slate-500 hover:text-brand-600 font-medium flex items-center gap-1">
                <i class="fas fa-sync-alt text-[10px]"></i> Refresh Data Live
            </button>
            <button onclick="openCameraScanner()" class="text-xs text-brand-500 hover:text-brand-600 font-medium flex items-center gap-1 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                <i class="fas fa-camera text-[10px]"></i> Kamera Scanner
            </button>
        </div>

        <div id="result-panel" class="result-panel">
            <div id="result-content"></div>
        </div>
    </section>

    <!-- Camera Scanner -->
    <section id="section-camera" class="mb-3 hidden">
        <div class="scanner-wrap border border-slate-200">
            <div class="vf-corner vf-tl"></div>
            <div class="vf-corner vf-tr"></div>
            <div class="vf-corner vf-bl"></div>
            <div class="vf-corner vf-br"></div>
            <div class="scan-line"></div>
            <div id="reader" style="width:100%"></div>
        </div>
        <button onclick="closeCameraScanner()" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-xl text-xs transition-all active:scale-[.98]">
            <i class="fas fa-times mr-1"></i> Tutup Kamera
        </button>
    </section>

    <!-- Tab Navigasi -->
    <section class="mb-3">
        <div class="flex bg-white rounded-xl p-1 mb-2.5 border border-slate-100 shadow-sm text-xs">
            <button onclick="switchTab('log')" id="tab-log" class="tab-btn active flex-1 py-2 rounded-lg flex items-center justify-center gap-1">
                <i class="fas fa-clock-rotate-left text-[10px]"></i> Riwayat Hari Ini
            </button>
            <button onclick="switchTab('rekap')" id="tab-rekap" class="tab-btn flex-1 py-2 rounded-lg text-slate-400 flex items-center justify-center gap-1">
                <i class="fas fa-chart-pie text-[10px]"></i> Rekap & Filter
            </button>
            <button onclick="switchTab('search')" id="tab-search" class="tab-btn flex-1 py-2 rounded-lg text-slate-400 flex items-center justify-center gap-1">
                <i class="fas fa-search text-[10px]"></i> Cari
            </button>
        </div>

        <!-- Panel 1: Riwayat -->
        <div id="panel-log">
            <div class="flex gap-1.5 mb-2 overflow-x-auto pb-1 text-[11px]">
                <button onclick="filterLog('all')" id="flt-all" class="px-2.5 py-1 rounded-lg bg-brand-500 text-white font-medium shrink-0 transition-all">Semua</button>
                <button onclick="filterLog('on time')" id="flt-ontime" class="px-2.5 py-1 rounded-lg bg-white text-slate-600 border border-slate-200 shrink-0 transition-all">On Time</button>
                <button onclick="filterLog('in time')" id="flt-intime" class="px-2.5 py-1 rounded-lg bg-white text-slate-600 border border-slate-200 shrink-0 transition-all">In Time</button>
                <button onclick="filterLog('terlambat')" id="flt-late" class="px-2.5 py-1 rounded-lg bg-white text-slate-600 border border-slate-200 shrink-0 transition-all">Terlambat</button>
                <button onclick="filterLog('tidak hadir')" id="flt-absent" class="px-2.5 py-1 rounded-lg bg-white text-slate-600 border border-slate-200 shrink-0 transition-all">Tidak Hadir</button>
            </div>
            <div id="recent-log" class="space-y-1.5 max-h-[45vh] overflow-y-auto"></div>
            <div id="log-empty" class="text-center py-6 text-slate-400 text-xs hidden">
                <i class="fas fa-inbox text-base mb-1 block opacity-50"></i> Belum ada absensi hari ini
            </div>
        </div>

        <!-- Panel 2: Rekap -->
        <div id="panel-rekap" class="hidden space-y-2.5">
            <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
                <span class="font-bold text-slate-700">Pilih Tanggal Rekap:</span>
                <input type="date" id="filter-rekap-date" onchange="updateRekap()" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 font-bold text-slate-800 text-xs focus:border-brand-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
                    <div id="rekap-ontime" class="text-lg font-bold text-ok-600">0</div>
                    <div class="text-[10px] text-slate-400 uppercase">On Time</div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
                    <div id="rekap-intime" class="text-lg font-bold text-brand-600">0</div>
                    <div class="text-[10px] text-slate-400 uppercase">In Time</div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
                    <div id="rekap-terlambat" class="text-lg font-bold text-amber-600">0</div>
                    <div class="text-[10px] text-slate-400 uppercase">Terlambat</div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
                    <div id="rekap-tidakhadir" class="text-lg font-bold text-rose-600">0</div>
                    <div class="text-[10px] text-slate-400 uppercase">Tidak Hadir</div>
                </div>
            </div>
        </div>

        <!-- Panel 3: Cari -->
        <div id="panel-search" class="hidden">
            <div class="relative mb-2">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search-input" placeholder="Cari ID, nama, atau jabatan..."
                       class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:border-brand-500 transition-all"
                       oninput="handleSearch(this.value)">
                <span id="search-count" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded"></span>
            </div>
            <div id="search-results" class="space-y-1.5 max-h-[45vh] overflow-y-auto"></div>
        </div>
    </section>

</main>

<!-- Notifikasi melayang di TENGAH layar -->
<div id="toast-box" class="fixed inset-0 z-[60] flex flex-col items-center justify-center gap-2.5 pointer-events-none px-8"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyrX-228Q5twj4pdrEmdnmndk8EJ_1eOvvB2iccrof7sLACdjOGGYe-NikbM2KVQ1M/exec';
const POLL_INTERVAL = 2000;      // cek perubahan tiap 2 detik (request SANGAT ringan)
const FALLBACK_REFRESH = 60000;  // full refresh cadangan tiap 60 detik

let allPeserta = [];
let hadirMap = {};         // kunci memakai idKey()
let hadirList = [];
let masterHadirData = [];
let html5Qr = null;
let cameraActive = false;
let processing = false;
let searchTimer = null;
let autoDetectTimer = null;
let currentFilter = 'all';
let pendingCheckins = {};  // absensi lokal yang belum terkonfirmasi server
let lastVersion = null;
let lastConfigVersion = null;
let dataLoading = false;
const AUTO_DETECT_DELAY = 300;

/* ==== UTIL ==== */
function idKey(v) {
    const s = String(v == null ? '' : v).trim();
    if (/^\d+$/.test(s)) return 'n:' + String(parseInt(s, 10));
    return 's:' + s;
}

// GET selalu dengan cache-buster agar respons tidak di-cache browser/proxy
function apiGet(action) {
    return fetch(`${API_URL}?action=${action}&_t=${Date.now()}`, { cache: 'no-store' })
        .then(r => r.json());
}

function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function localTimestampStr() {
    const d = new Date();
    return `${todayStr()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('filter-rekap-date').value = todayStr();

    // SATU request untuk semua data + konfigurasi -> load awal jauh lebih cepat
    loadData();

    // Cek versi tiap 2 detik; hanya refresh penuh jika ADA perubahan
    startPolling();

    // Refresh cadangan (menangkap edit manual langsung di sheet)
    setInterval(() => { if (!document.hidden) loadData(); }, FALLBACK_REFRESH);

    // Langsung refresh saat tab dibuka kembali dari background
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadData(); });

    setTimeout(() => document.getElementById('scan-input').focus(), 300);
    setTimeout(hideLoader, 12000); // jaga-jaga
});

/* ==== LIVE UPDATE: hanya refresh saat ada perubahan ==== */
let pollTimer = null;
function startPolling() {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
        if (!document.hidden) {
            try {
                const r = await apiGet('check'); // endpoint super ringan
                if (r.status === 'success') {
                    if (!dataLoading) {
                        if (lastVersion !== null && r.version !== lastVersion) loadData();
                        else if (lastConfigVersion !== null && r.configVersion !== lastConfigVersion) loadData();
                    }
                    lastVersion = r.version;
                    lastConfigVersion = r.configVersion;
                    setSyncDot(true);
                }
            } catch (e) {
                setSyncDot(false);
            }
        }
        startPolling(); // jadwalkan cek berikutnya
    }, POLL_INTERVAL);
}

function hideLoader() {
    const l = document.getElementById('loader');
    if (l && !l.dataset.done) {
        l.dataset.done = '1';
        l.style.opacity = '0';
        setTimeout(() => l.remove(), 300);
    }
}

async function loadData() {
    if (dataLoading) return;
    dataLoading = true;
    try {
        const r = await apiGet('all'); // 1 request: peserta + absensi + jam + versi
        if (r.status !== 'success') throw new Error('respons tidak valid');

        allPeserta = r.data || [];
        masterHadirData = r.hadir || [];

        // Tampilkan jam yang TERSIMPAN sebelumnya begitu aplikasi dibuka
        if (r.targetTime) document.getElementById('target-time').value = r.targetTime;
        document.getElementById('config-status-label').textContent =
            r.isLocked ? "Terkunci (Tersinkronisasi)" : "Sinkron dari Cloud";

        hadirMap = {};
        hadirList = [];
        const todayYYYYMMDD = todayStr();

        masterHadirData.forEach(h => {
            const ts = String(h['Timestamp']||'');
            if (ts.startsWith(todayYYYYMMDD) || ts.includes(todayYYYYMMDD)) {
                const idAsli = String(h['ID']||'').trim();
                const status = String(h['Status']||'').trim().toLowerCase();
                if (idAsli !== '') {
    hadirMap[idKey(idAsli)] = h; // simpan semua status, termasuk "tidak hadir"
}
hadirList.push(h);
            }
        });

        // Gabungkan absensi lokal yang baru di-scan (belum muncul di server)
        Object.keys(pendingCheckins).forEach(k => {
            const known = hadirMap[k];
            if (known && String(known['Status']||'').toLowerCase() !== 'tidak hadir') {
                delete pendingCheckins[k]; // sudah terkonfirmasi server
            } else {
                hadirMap[k] = pendingCheckins[k];
                hadirList.push(pendingCheckins[k]);
                masterHadirData.push(pendingCheckins[k]);
            }
        });

        cekOtomatisTidakHadir();
        hadirList.sort((a,b) => new Date(b.Timestamp||0) - new Date(a.Timestamp||0));
        updateStats(); renderLog(); updateRekap();

        lastVersion = r.version || lastVersion;
        lastConfigVersion = r.configVersion || lastConfigVersion;
        setSyncLabel(true);
        hideLoader();
    } catch (e) {
        console.error(e);
        setSyncLabel(false);
        hideLoader();
    } finally {
        dataLoading = false;
    }
}

async function loadConfig() {
    try {
        const r = await apiGet('getConfig');
        if (r.status === 'success') {
            document.getElementById('target-time').value = r.targetTime;
            document.getElementById('config-status-label').textContent =
                r.isLocked ? "Terkunci (Tersinkronisasi)" : "Sinkron dari Cloud";
        }
    } catch (e) { console.error(e); }
}

async function konfirmasiUbahWaktu(newTime) {
    const pin = prompt("Pengaturan waktu sudah terkunci/disinkronkan.\nMasukkan PIN Admin untuk mengubah jam:");
    if (!pin) { loadConfig(); return; }

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'saveConfig', targetTime: newTime, pin: pin })
        });
        const r = await res.json();
        if (r.status === 'success') {
            toast('Jam berhasil diubah & disinkronkan!', 'success');
            // versi config naik -> semua device otomatis ikut berubah
        } else {
            toast(r.message || "PIN Salah!", 'error');
            loadConfig();
        }
    } catch (e) {
        toast('Gagal menyimpan pengaturan waktu', 'error');
        loadConfig();
    }
}

function hitungStatusKehadiran() {
    const targetTimeStr = document.getElementById('target-time').value;
    if (!targetTimeStr) return "in time";

    const [tHour, tMin] = targetTimeStr.split(':').map(Number);
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const targetMinutes = tHour * 60 + tMin;
    const diffMinutes = currentMinutes - targetMinutes;

    if (diffMinutes < 0)    return "in time";     // sebelum jam acara
    if (diffMinutes === 0)  return "on time";     // tepat jam acara
    if (diffMinutes <= 120) return "terlambat";   // s.d. 2 jam setelah jam acara
    return "tidak hadir";                          // lebih dari 2 jam setelah jam acara
}

function cekOtomatisTidakHadir() {
    const targetTimeStr = document.getElementById('target-time').value;
    if (!targetTimeStr) return;
    const [tHour, tMin] = targetTimeStr.split(':').map(Number);
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const targetMinutes = tHour * 60 + tMin;

    if (currentMinutes - targetMinutes > 120) {
        allPeserta.forEach(p => {
            const id = String(p['ID'] == null ? '' : p['ID']).trim();
            if (id !== '' && !hadirMap[idKey(id)]) {
                const entry = {Timestamp: localTimestampStr(), ID: id, Nama: p['Nama']||'-', Jabatan: p['Jabatan']||'-', Status: 'tidak hadir'};
                hadirMap[idKey(id)] = entry;
                hadirList.push(entry);
            }
        });
    }
}

function handleScanKey(event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    clearTimeout(autoDetectTimer);
    processScan();
}

function handleScanInput() {
    clearTimeout(autoDetectTimer);
    const val = document.getElementById('scan-input').value.trim();
    if (!val) return;
    autoDetectTimer = setTimeout(() => { processScan(); }, AUTO_DETECT_DELAY);
}

function processScan() {
    const input = document.getElementById('scan-input');
    const code = input.value.trim();
    if (!code || processing) return;

    processing = true;
    setScanStatus('processing');

    const codeKey = idKey(code);
    const person = allPeserta.find(p => idKey(p['ID']) === codeKey || idKey(p['No HP']) === codeKey);

    if (!person) {
        setScanStatus('error');
        toast(`Peserta tidak ditemukan: "${code}"`, 'error');
        setTimeout(() => { input.value=''; input.focus(); setScanStatus('idle'); processing = false; }, 1000);
        return;
    }

    const k = idKey(person['ID']);
    const already = hadirMap[k] !== undefined && String(hadirMap[k]['Status']||'').toLowerCase() !== 'tidak hadir';

    if (already) {
        setScanStatus('warning');
        toast(`${person['Nama']} sudah tercatat hadir hari ini`, 'warning');
        setTimeout(() => { input.value=''; input.focus(); setScanStatus('idle'); processing = false; }, 1200);
        return;
    }

    doCheckin(person);
}

async function doCheckin(person) {
    const input = document.getElementById('scan-input');
    const statusKehadiran = hitungStatusKehadiran();
    const id = String(person['ID'] == null ? '' : person['ID']).trim();
    const k = idKey(id);
    const ts = localTimestampStr();

    const entry = {Timestamp: ts, ID: id, Nama: person['Nama']||'-', Jabatan: person['Jabatan']||'-', Status: statusKehadiran};
    hadirMap[k] = entry;
    hadirList.unshift(entry);
    masterHadirData.unshift(entry);
    pendingCheckins[k] = entry;

    setScanStatus('success');
    toast(`${person['Nama']} (${statusKehadiran})`, 'success');
    updateStats(); renderLog(); updateRekap();

    input.value = '';
    setTimeout(() => { input.focus(); setScanStatus('idle'); processing = false; }, 600);

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
                action: 'hadir',
                id: id,
                nama: person['Nama']||'-',
                jabatan: person['Jabatan']||'-',
                statusAbsen: statusKehadiran
            })
        });
        const r = await res.json();
        if (r.status !== 'success') throw new Error(r.message || 'Gagal menyimpan');
        loadData(); // konfirmasi cepat; device lain via version-polling
    } catch (e) {
        console.error(e);
        delete pendingCheckins[k];
        delete hadirMap[k];
        hadirList = hadirList.filter(h => h !== entry);
        masterHadirData = masterHadirData.filter(h => h !== entry);
        toast('Gagal menyimpan ke server. Silakan scan ulang.', 'error');
        updateStats(); renderLog(); updateRekap();
    }
}

function setScanStatus(status) {
    const wrap = document.getElementById('scan-field-wrap');
    wrap.className = 'scan-field bg-white border-2 rounded-2xl p-1 shadow-lg shadow-brand-500/8';
    if(status === 'success') wrap.classList.add('border-ok-500', 's-success');
    else if(status === 'error') wrap.classList.add('border-err-500', 's-error');
    else if(status === 'warning') wrap.classList.add('border-warn-400', 's-warning');
    else if(status === 'processing') wrap.classList.add('border-warn-400', 's-processing');
}

/* ==== KAMERA: library dimuat HANYA saat dibuka (load awal lebih ringan) ==== */
function loadQrLibrary() {
    return new Promise((resolve, reject) => {
        if (window.Html5Qrcode) { resolve(); return; }
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Library scanner gagal dimuat'));
        document.head.appendChild(s);
    });
}

async function openCameraScanner() {
    if (cameraActive) return;
    try {
        document.getElementById('section-camera').classList.remove('hidden');
        await loadQrLibrary();
        if (!html5Qr) html5Qr = new Html5Qrcode('reader');
        await html5Qr.start({facingMode:'environment'},{fps:15,qrbox:{width:220,height:220},aspectRatio:1.0},onCameraScan,()=>{});
        cameraActive = true;
    } catch(e) {
        cameraActive = false;
        document.getElementById('section-camera').classList.add('hidden');
        toast('Kamera tidak tersedia','error');
    }
}

async function closeCameraScanner() {
    if(!cameraActive) return;
    try{ if (html5Qr) await html5Qr.stop(); }catch(e){}
    cameraActive = false;
    document.getElementById('section-camera').classList.add('hidden');
    document.getElementById('scan-input').focus();
}

function onCameraScan(txt) {
    if(navigator.vibrate) navigator.vibrate(50);
    closeCameraScanner();
    const input = document.getElementById('scan-input');
    input.value = txt.trim();
    processScan();
}

function filterLog(status) {
    currentFilter = status;
    ['all', 'ontime', 'intime', 'late', 'absent'].forEach(k => {
        const btn = document.getElementById('flt-' + k);
        if(btn) {
            btn.className = 'px-2.5 py-1 rounded-lg bg-white text-slate-600 border border-slate-200 shrink-0 transition-all';
        }
    });

    const activeBtnMap = {'all':'all', 'on time':'ontime', 'in time':'intime', 'terlambat':'late', 'tidak hadir':'absent'};
    const activeBtn = document.getElementById('flt-' + activeBtnMap[status]);
    if(activeBtn) activeBtn.className = 'px-2.5 py-1 rounded-lg bg-brand-500 text-white font-medium shrink-0 transition-all';

    renderLog();
}

function renderLog() {
    const box = document.getElementById('recent-log');
    const empty = document.getElementById('log-empty');

    const filtered = currentFilter === 'all' ? hadirList : hadirList.filter(h => String(h['Status']||'').toLowerCase() === currentFilter);

    if(!filtered.length){
        box.innerHTML = '';
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');

    box.innerHTML = filtered.slice(0, 30).map(h => {
        const nama = h['Nama']||'-', id = h['ID']||'', waktu = h['Timestamp']||'-';
        const st = String(h['Status']||'on time').toLowerCase();
        const badgeColor = st === 'on time' ? 'bg-ok-50 text-ok-600' : (st === 'in time' ? 'bg-brand-50 text-brand-600' : (st === 'terlambat' ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-600'));
        return `
        <div class="log-in flex items-center gap-2 bg-white rounded-xl px-3 py-2 border border-slate-100">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1">
                    <span class="text-xs font-medium text-slate-800 truncate">${esc(nama)}</span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded ${badgeColor} font-bold">${esc(st)}</span>
                </div>
                <div class="text-[10px] text-slate-400">ID: ${esc(id)}</div>
            </div>
            <div class="text-[9px] text-slate-400 shrink-0 text-right">${esc(waktu)}</div>
        </div>`;
    }).join('');
}

function updateRekap() {
    const dateInput = document.getElementById('filter-rekap-date').value;
    if (!dateInput) return;

    let ontime = 0, intime = 0, terlambat = 0, tidakHadir = 0;

    masterHadirData.forEach(h => {
        const ts = String(h['Timestamp']||'');
        if (ts.startsWith(dateInput) || ts.includes(dateInput)) {
            const s = String(h['Status']||'').toLowerCase();
            if(s === 'on time') ontime++;
            else if(s === 'in time') intime++;
            else if(s === 'terlambat') terlambat++;
            else if(s === 'tidak hadir') tidakHadir++;
        }
    });

    document.getElementById('rekap-ontime').textContent = ontime;
    document.getElementById('rekap-intime').textContent = intime;
    document.getElementById('rekap-terlambat').textContent = terlambat;
    document.getElementById('rekap-tidakhadir').textContent = tidakHadir;
}

function handleSearch(q) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => renderSearchResults(q.trim()), 150);
}

function renderSearchResults(q) {
    const box = document.getElementById('search-results'), cnt = document.getElementById('search-count');
    if(!q){cnt.classList.add('hidden');box.innerHTML='';return;}
    const ql = q.toLowerCase();
    const res = allPeserta.filter(p => ['ID','Nama','Jabatan'].some(f => String(p[f]||'').toLowerCase().includes(ql)));
    cnt.classList.remove('hidden'); cnt.textContent = res.length + ' hasil';
    if(!res.length){box.innerHTML=`<div class="text-center py-6 text-slate-400 text-xs">Tidak ditemukan</div>`;return;}

    box.innerHTML = res.slice(0, 25).map(p => {
        const id = String(p['ID']||'').trim();
        const hEntry = hadirMap[idKey(id)];
        const hadir = hEntry !== undefined && String(hEntry['Status']||'').toLowerCase() !== 'tidak hadir';
        const idx = allPeserta.indexOf(p);
        return `
        <div class="card px-3 py-2 cursor-pointer ${hadir?'border-l-[3px] border-l-ok-500':''}" onclick="doCheckin(allPeserta[${idx}])">
            <div class="flex items-center justify-between">
                <div>
                    <div class="font-semibold text-slate-800 text-xs">${esc(p['Nama'])}</div>
                    <div class="text-[10px] text-slate-400">ID: ${esc(id)} &middot; ${esc(p['Jabatan']||'-')}</div>
                </div>
                ${hadir?'<span class="text-[9px] bg-ok-50 text-ok-600 px-1.5 py-0.5 rounded font-medium">Hadir</span>':'<span class="text-[9px] bg-brand-50 text-brand-600 px-1.5 py-0.5 rounded">Absenkan</span>'}
            </div>
        </div>`;
    }).join('');
}

function switchTab(tab) {
    ['log', 'rekap', 'search'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
        document.getElementById('tab-' + t).classList.toggle('text-slate-400', t !== tab);
        document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);
    });
    if(tab === 'search') document.getElementById('search-input').focus();
    else document.getElementById('scan-input').focus();
}

function updateStats() {
    const total = allPeserta.length;
    const hadirSet = new Set();
    Object.keys(hadirMap).forEach(k => {
        if(String(hadirMap[k]['Status']||'').toLowerCase() !== 'tidak hadir') hadirSet.add(k);
    });
    const hadir = hadirSet.size, belum = Math.max(0, total - hadir);
    const pct = total > 0 ? Math.round((hadir / total) * 100) : 0;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-hadir').textContent = hadir;
    document.getElementById('stat-belum').textContent = belum;
    document.getElementById('stat-persen').textContent = pct + '%';
    document.getElementById('progress-bar').style.width = pct + '%';
}

/* ==== TOAST DI TENGAH LAYAR ==== */
function toast(msg, type='info') {
    const box = document.getElementById('toast-box');
    const el = document.createElement('div');
    const map = {
        success: { icon: 'fa-circle-check',        color: 'text-ok-500',    border: 'border-ok-400' },
        error:   { icon: 'fa-circle-xmark',        color: 'text-err-500',   border: 'border-err-500' },
        warning: { icon: 'fa-triangle-exclamation',color: 'text-warn-500',  border: 'border-warn-400' },
        info:    { icon: 'fa-circle-info',         color: 'text-brand-500', border: 'border-brand-400' }
    };
    const c = map[type] || map.info;
    el.className = `toast-in pointer-events-auto bg-white border-2 ${c.border} rounded-2xl px-5 py-3.5 shadow-2xl shadow-slate-900/20 flex items-center gap-3 max-w-sm`;
    el.innerHTML = `<i class="fas ${c.icon} ${c.color} text-lg shrink-0"></i><span class="text-sm font-semibold text-slate-800 leading-snug">${esc(msg)}</span>`;
    box.appendChild(el);
    setTimeout(() => {
        el.classList.remove('toast-in');
        el.classList.add('toast-out');
        setTimeout(() => el.remove(), 200);
    }, 2200);
}

function setSyncLabel(ok) {
    const dot = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    if (ok) {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-ok-500 animate-pulse';
        label.textContent = 'Live · sinkron ' + new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-err-500';
        label.textContent = 'Koneksi terputus — mencoba lagi…';
    }
}

function setSyncDot(ok) {
    const dot = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    if (ok) {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-ok-500 animate-pulse';
    } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-err-500';
        label.textContent = 'Koneksi terputus — mencoba lagi…';
    }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.addEventListener('click', (e) => {
    const si = document.getElementById('scan-input');
    if(!si) return;
    if(e.target.id === 'search-input' || e.target.closest('#panel-search') || e.target.closest('#panel-rekap')) return;
    if(e.target.closest('button') || e.target.closest('a')) return;
    si.focus();
});
</script>
