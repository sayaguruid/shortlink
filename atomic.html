<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atomic School LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Jspdf & Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>tailwind.config={theme:{extend:{fontFamily:{h:['Outfit','sans-serif'],b:['DM Sans','sans-serif']}}}}</script>
  <style>
    :root{--g1:#1D4ED8;--g2:#1E40AF;--g3:#1E3A5F;--g4:#3B82F6;--g5:#60A5FA;--gl:#DBEAFE;--gxl:#EFF6FF;--gxxl:#F0F7FF;--y1:#F59E0B;--y2:#FBBF24;--y3:#D97706;--yl:#FEF3C7;--bg:#EFF3F8;--bd:#D1DBE8;--tx:#0F172A;--tx2:#334155;--tx3:#64748B}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
    h1,h2,h3,h4{font-family:'Outfit',sans-serif}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--g5);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

    .mo{position:fixed;inset:0;background:rgba(15,23,42,.12);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px)}.mo.on{display:flex}
    .mb{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(29,78,216,.1);animation:mU .2s ease}.mb.lg{max-width:860px}.mb.xl{max-width:1100px}
    @keyframes mU{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}.mbo{padding:14px 20px}.mf{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end}
    #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;padding:14px 22px;border-radius:12px;color:#fff;font-size:13px;font-weight:500;display:none;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:tI .25s ease}
    #toast.on{display:flex} @keyframes tI{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

    .sk{background:linear-gradient(90deg,var(--bd) 25%,var(--gxxl) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:6px}
    @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .fi{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:10px 13px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;background:#fff;color:var(--tx)}
    .fi:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(29,78,216,.08)}
    .fl{display:block;font-size:11.5px;font-weight:600;color:var(--tx3);margin-bottom:5px;text-transform:uppercase}
    
    .bt{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:all .15s}
    .bt1{background:var(--g1);color:#fff}.bt1:hover{background:var(--g2);box-shadow:0 4px 14px rgba(29,78,216,.3)}
    .bt2{background:#fff;color:var(--tx2);border:1.5px solid var(--bd)}.bt2:hover{border-color:var(--g1);color:var(--g1);background:var(--gxxl)}
    .btd{background:#fff;color:#EF4444;border:1.5px solid #FECACA}.btd:hover{background:#FEF2F2;border-color:#EF4444}
    .bty{background:var(--y1);color:#fff;border:none}.bty:hover{background:var(--y3);box-shadow:0 4px 14px rgba(245,158,11,.3)}
    .bts{padding:6px 12px;font-size:12px;border-radius:8px}.btg{background:#059669;color:#fff}
    
    .cd{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:20px}
    .sc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px}
    .tb{width:100%;border-collapse:collapse;font-size:13px}
    .tb th{text-align:left;padding:9px 12px;background:var(--gxxl);color:var(--tx3);font-weight:600;font-size:10.5px;text-transform:uppercase;border-bottom:1px solid var(--bd)}
    .tb td{padding:9px 12px;border-bottom:1px solid #F0F4F8}
    .bg1{background:var(--gl);color:var(--g3)}.bg2{background:var(--gxxl);color:var(--g2)}.bg3{background:#FEE2E2;color:#991B1B}.bg4{background:var(--bd);color:var(--tx3)}.bgy{background:var(--yl);color:var(--y3)}.bgg{background:#D1FAE5;color:#065F46}
    .bd{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600}
    .fi-in{animation:fU .3s ease} @keyframes fU{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    
    .info-box{background:var(--gl);border:1px solid #93C5FD;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:8px}
    .info-box i{color:var(--g1);margin-top:2px} .info-box p{font-size:12px;color:var(--g3)}
    .danger-box{background:#FEE2E2;border:1px solid #FECACA;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:8px}
    .danger-box i{color:#DC2626;margin-top:2px} .danger-box p{font-size:12px;color:#991B1B}
    .ibtn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--tx3);font-size:11px}
    .ibtn:hover{border-color:var(--g1);color:var(--g1);background:var(--gxxl)}
    .ibtn.del:hover{border-color:#EF4444;color:#EF4444;background:#FEF2F2}
    .pag-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--tx3);font-size:12px;font-weight:600}
    .pag-btn.act{background:var(--g1);color:#fff;border-color:var(--g1)}
    
    .qo{border:2px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
    .qo:hover{border-color:var(--g1);background:var(--gxxl)}.qo.sel{border-color:var(--g1);background:var(--gl)}.qo.ok{border-color:var(--g1);background:var(--gl)}.qo.no{border-color:#EF4444;background:#FEE2E2}
    .qo .ql{width:28px;height:28px;border-radius:7px;background:var(--gxxl);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:var(--g2)}
    .qo.sel .ql,.qo.ok .ql{background:var(--g1);color:#fff}.qo.no .ql{background:#EF4444;color:#fff}

    #loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#F8FAFC}
    .login-card{background:#fff;border:1px solid #E2E8F0;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 20px 40px -15px rgba(0,0,0,0.05)}
    .login-btn{background:var(--g1);color:#fff;border-radius:12px;padding:14px;width:100%;font-weight:700;display:flex;justify-content:center;gap:8px;cursor:pointer;transition:all .2s}
    .login-btn:hover{background:var(--g2);box-shadow:0 8px 20px rgba(29,78,216,.25);transform:translateY(-1px)}
    
    #sidebar{position:fixed;top:0;left:0;width:252px;height:100vh;background:#fff;border-right:1px solid var(--bd);z-index:40;display:flex;flex-direction:column;transition:transform .25s}
    #sidebarOverlay{position:fixed;inset:0;background:rgba(15,23,42,.12);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
    #sidebarOverlay.on{opacity:1;pointer-events:auto}
    .ni{display:flex;align-items:center;gap:11px;padding:9px 14px;margin:1px 8px;border-radius:8px;color:var(--tx3);font-size:13px;font-weight:500;cursor:pointer;border-left:3px solid transparent}
    .ni:hover{background:var(--gxxl);color:var(--g2)}.ni.on{background:var(--g1);color:#fff;border-left:3px solid var(--y1)}
    .ni i{width:18px;text-align:center;font-size:13px}
    #mainWrap{margin-left:252px;min-height:100vh;display:flex;flex-direction:column}
    #mc{flex:1;padding:28px;max-width:1080px;width:100%;margin:0 auto}
    #mHeader{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:#fff;border-bottom:1px solid var(--bd);z-index:30;align-items:center;padding:0 14px;gap:10px}
    @media(max-width:768px){#sidebar{transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#mainWrap{margin-left:0;padding-top:52px}#mHeader{display:flex}#mc{padding:16px}}
  </style>
</head>
<body>

<div id="glLoader" class="fixed inset-0 z-[9999] hidden items-center justify-center" style="background:rgba(15,23,42,0.4);backdrop-filter:blur(3px)">
  <div class="bg-white px-8 py-6 rounded-2xl flex flex-col items-center gap-4 shadow-2xl">
    <i class="fas fa-circle-notch fa-spin text-4xl" style="color:var(--g1)"></i>
    <p class="text-sm font-700 text-slate-800">Memproses...</p>
  </div>
</div>

<div id="loginPage">
  <div class="login-card">
    <div class="text-center mb-6">
      <img src="https://i.imgur.com/zKX5JtG.jpeg" alt="Logo" class="w-16 h-16 mx-auto mb-3 rounded-xl shadow-sm object-cover">
      <h1 class="text-2xl font-h font-800 text-slate-800 tracking-tight">Atomic School</h1>
      <p class="text-sm mt-1 text-slate-500">Sistem Manajemen Pembelajaran</p>
    </div>
    <div class="space-y-3">
      <div><label class="fl">Email</label><input id="lE" type="email" class="fi" placeholder="emailanda@contoh.com"></div>
      <div><label class="fl">Password</label><input id="lP" type="password" class="fi" placeholder="Masukkan password"></div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <div><label class="fl">Semester</label><select id="lSM" class="fi"><option value="1">Ganjil (1)</option><option value="2">Genap (2)</option></select></div>
        <div><label class="fl">Tahun Pelajaran</label><select id="lTP" class="fi"><option value="2023/2024">2023/2024</option></select></div>
      </div>
      <div id="lErr" class="text-xs text-red-500 hidden bg-red-50 p-2.5 rounded-lg border border-red-100 font-500 text-center mt-3"></div>
      <button onclick="doLogin()" id="lBtn" class="login-btn mt-6"><i class="fas fa-arrow-right-to-bracket"></i> Masuk</button>
    </div>
  </div>
</div>

<div id="appPage" class="hidden">
  <header id="mHeader">
    <button onclick="togSB()" style="color:var(--g1)" class="text-lg"><i class="fas fa-bars"></i></button>
    <div class="flex items-center gap-2"><span class="font-h font-700 text-sm" style="color:var(--g2)">Atomic School</span></div>
  </header>
  
  <div id="sidebarOverlay" onclick="clsSB()"></div>
  <aside id="sidebar">
    <div class="p-4 pb-2">
      <div class="flex items-center gap-2.5">
        <div><h2 class="font-h font-800 text-base leading-tight" style="color:var(--g2)">Atomic School</h2></div>
      </div>
    </div>
    <div class="px-3 py-1.5">
      <div class="rounded-lg p-2.5 mb-2" style="background:var(--gxxl)">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full flex items-center justify-center font-h font-700 text-xs" style="background:var(--g1);color:#fff" id="avI">-</div>
          <div class="min-w-0">
            <p class="text-[13px] font-600 truncate" style="color:var(--tx)" id="sbN">-</p>
            <p class="text-[11px] truncate line-clamp-2" style="color:var(--tx3)" id="sbR">-</p>
          </div>
        </div>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto" id="sbNav"></nav>
    <div class="p-3" style="border-top:1px solid var(--bd)"><div class="ni" style="color:#EF4444" onclick="doLogout()"><i class="fas fa-arrow-right-from-bracket"></i><span>Keluar</span></div></div>
  </aside>
  
  <div id="mainWrap">
    <main id="mc"></main>
    <footer class="text-center text-[11px] py-3 mt-auto" style="color:var(--tx3);border-top:1px solid var(--bd);background:#fff">&copy; sayaguru.id</footer>
  </div>
</div>

<div class="mo" id="modal"><div class="mb" id="mBox"><div class="mh"><h3 class="font-h font-700 text-base" style="color:var(--tx)" id="mTi"></h3><button onclick="clM()" class="w-7 h-7 flex items-center justify-center hover:bg-gray-100 rounded"><i class="fas fa-xmark"></i></button></div><div class="mbo" id="mBo"></div><div class="mf" id="mFo"></div></div></div>
<div class="mo" id="viewer"><div class="mb lg" id="vBox"><div class="mh"><h3 class="font-h font-700 text-base" style="color:var(--tx)" id="vTi"></h3><button onclick="clV()" class="w-7 h-7 flex items-center justify-center hover:bg-gray-100 rounded"><i class="fas fa-xmark"></i></button></div><div class="mbo" style="padding:0"><iframe id="vIf" style="width:100%;height:72vh;border:none;border-radius:0 0 16px 16px" allowfullscreen></iframe></div></div></div>
<div class="mo" id="confirmModal"><div class="mb" style="max-width:380px"><div class="mh"><h3 class="font-h font-700 text-base" style="color:#991B1B">Konfirmasi</h3><button onclick="clCF()" class="w-7 h-7 flex items-center justify-center hover:bg-gray-100 rounded"><i class="fas fa-xmark"></i></button></div><div class="mbo"><p class="text-sm" style="color:var(--tx2)" id="cfMs"></p></div><div class="mf"><button class="bt bt2" onclick="clCF()">Batal</button><button class="bt btd" id="cfBtn"><i class="fas fa-trash"></i> Hapus</button></div></div></div>
<div class="mo" id="pdfModal"><div class="mb xl"><div class="mh"><h3 class="font-h font-700 text-base" id="pdfTi">Preview PDF</h3><button onclick="clPDF()" class="w-7 h-7 flex items-center justify-center hover:bg-gray-100 rounded"><i class="fas fa-xmark"></i></button></div><div class="mbo" id="pdfPreview" style="height:65vh"></div><div class="mf"><button class="bt bt2" onclick="clPDF()">Tutup</button><button class="bt bty" id="pdfDlBtn"><i class="fas fa-download"></i> Unduh PDF</button></div></div></div>
<div id="toast"><i id="tIc" class="fas fa-check-circle"></i><span id="tMs"></span></div>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbwZJZNV_IQSI_LXc7XJVFnxjdKeqax408ZVL_hzhMzL6OCrPqHoJpk_OS4m6IP8UZiD/exec'; // GANTI URL WEB APP ANDA
const LOGO_URL = 'https://i.imgur.com/zKX5JtG.jpeg';
let LOGO_B64 = '';

const A = {u:null, p:'dashboard', sess:{semester:'1', tahunPelajaran:''}, d:{mapel:[],kelas:[],tugas:[],jawaban:[],nk:[],progress:[],soal:[]}, qs:{a:{},s:false}, raPage:{}, raData:[], raFilter:{}, jgPage:1, ygPage:1, ymPage:1};
const _c = {};
const _sk = ['addMateri','updateMateri','deleteMateri','addSoal','updateSoal','deleteSoal','addTugas','updateTugas','deleteTugas','submitKuis','submitTugas','nilaiTugas','deleteNilaiTugas','submitAbsensi','addSiswa','updateSiswa','deleteSiswa','updateProgress','addJurnal','updateJurnal','deleteJurnal','addMapel','updateMapel','deleteMapel','submitKarakter'];

const NV = {
  Siswa: [{i:'dashboard',c:'fa-house',l:'Dashboard'},{i:'materi',c:'fa-book-open',l:'Materi'},{i:'latihan',c:'fa-pen-to-square',l:'Latihan'},{i:'tugas',c:'fa-file-lines',l:'Tugas'},{i:'nilai',c:'fa-chart-column',l:'Nilai'},{i:'transkrip',c:'fa-graduation-cap',l:'Rapor & Transkrip'}],
  Guru: [{i:'dashboard',c:'fa-house',l:'Dashboard'},{i:'kelola-mapel',c:'fa-layer-group',l:'Kelola Mapel'},{i:'kelola-siswa',c:'fa-users',l:'Kelola Pengguna'},{i:'kelola-materi',c:'fa-book-open',l:'Kelola Materi'},{i:'kelola-soal',c:'fa-list-check',l:'Kelola Soal'},{i:'kelola-tugas',c:'fa-file-circle-plus',l:'Kelola Tugas'},{i:'penilaian',c:'fa-star',l:'Penilaian Tugas'},{i:'karakter-guru',c:'fa-seedling',l:'Penilaian Karakter'},{i:'absensi',c:'fa-clipboard-check',l:'Absensi Siswa'},{i:'riwayat-absen',c:'fa-clock-rotate-left',l:'Riwayat Absen'},{i:'jurnal',c:'fa-book-journal-whills',l:'Jurnal Guru'},{i:'transkrip-kelas',c:'fa-file-excel',l:'Cetak Rapor Kelas'}],
  'Orang Tua': [{i:'dashboard',c:'fa-house',l:'Dashboard'},{i:'jurnal-anak',c:'fa-book-journal-whills',l:'Jurnal Kelas'},{i:'tugas',c:'fa-file-lines',l:'Tugas Anak'},{i:'nilai',c:'fa-chart-column',l:'Nilai Anak'},{i:'karakter-ortu',c:'fa-child-reaching',l:'Penilaian Karakter'},{i:'transkrip',c:'fa-graduation-cap',l:'Rapor Anak'}],
  'Kepala Sekolah': [{i:'dashboard',c:'fa-house',l:'Dashboard'},{i:'jurnal-pantau',c:'fa-book-journal-whills',l:'Pantau Jurnal'},{i:'riwayat-absen',c:'fa-clock-rotate-left',l:'Pantau Absensi'},{i:'transkrip-kelas',c:'fa-file-excel',l:'Cetak Rapor Siswa'}],
  Yayasan: [{i:'dashboard',c:'fa-house',l:'Dashboard'},{i:'y-guru',c:'fa-chalkboard-user',l:'Kehadiran Guru'},{i:'y-siswa',c:'fa-chart-pie',l:'Statistik Siswa'},{i:'y-materi',c:'fa-book-open',l:'Materi Diajarkan'}]
};

function normJ(j){if(!j||typeof j!=='object')return j;for(const k of Object.keys(j)){const lk=k.toLowerCase().replace(/[\s_\-]+/g,'');j[lk]=j[k]}return j}
function fmtDS(iso){if(!iso)return'-';let d=new Date(iso);if(isNaN(d.getTime()))return iso;const bl=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return d.getDate()+' '+bl[d.getMonth()]+' '+d.getFullYear()}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ytE(u){const m=(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?'https://www.youtube.com/embed/'+m[1]:u}
function drP(u){if(!u)return '';if(u.includes('drive.google.com')){let m=u.match(/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;return u.replace(/\/view(\?|$)/,'/preview$1').replace(/\/edit(\?|$)/,'/preview$1')}return u}
function so(a,s='',p='-- Pilih --'){return `<option value="">${p}</option>`+a.map(o=>{const v=typeof o==='string'?o:o.v,l=typeof o==='string'?o:o.l;return `<option value="${v}" ${v==s?'selected':''}>${l}</option>`}).join('')}
function soK(a,s='',p='-- Pilih --'){return `<option value="">${p}</option>`+a.map(o=>`<option value="${o}" ${o==s?'selected':''}>${o}</option>`)+`<option value="__new__" style="color:var(--y3);font-weight:600">+ Tambah Baru</option>`}
function invCache(actions){for(const k in _c){for(const a of actions){if(k.includes('"'+a+'"')){delete _c[k];break}}}}

function toast(m,t='success'){const e=document.getElementById('toast'),ic=document.getElementById('tIc'),ms=document.getElementById('tMs');e.style.background=t==='error'?'#EF4444':t==='warning'?'#F59E0B':'#1D4ED8';ic.className='fas '+(t==='error'?'fa-times-circle':t==='warning'?'fa-exclamation-triangle':'fa-check-circle');ms.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3000)}
function sk(h=12){return `<div class="sk" style="height:${h}px;margin-bottom:7px"></div><div class="sk" style="height:${h}px;margin-bottom:7px;width:70%"></div><div class="sk" style="height:${h}px;width:50%"></div>`}
function skC(){return '<div class="cd mb-3">'+sk()+'</div>'}
function empty(ic,m){return `<div class="text-center py-12 fi-in"><div class="w-16 h-16 rounded-2xl mx-auto mb-3 flex items-center justify-center" style="background:var(--gxxl)"><i class="fas ${ic} text-2xl" style="color:var(--g4)"></i></div><p class="text-sm font-500" style="color:var(--tx3)">${m}</p></div>`}
function st(ic,l,v,c1='var(--g1)'){return `<div class="sc fi-in"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${c1}"><i class="fas ${ic} text-white text-sm"></i></div><div><p class="text-[11px] font-500" style="color:var(--tx3)">${l}</p><p class="text-lg font-h font-800 leading-tight" style="color:var(--tx)">${v}</p></div></div></div>`}

    const tGuru = users.filter(u=>u.Role==='Guru').length;

    const tKelas = rK.success ? rK.data.length : 0;

    h+=st('fa-user-group','Total Orang Tua',tOrtu,'var(--g4)');
    h+=st('fa-door-open','Total Kelas',tKelas,'#EF4444');
    h+=`</div></div>`;

  }

  invCache(['getStats','getProgress']);
  const r=await api('getStats',{role: isOrtu ? 'Siswa' : A.u.Role, email: eml, kelas: kls});
  if(!r.success)return empty('fa-triangle-exclamation',r.message);

  let h=`<div class="fi-in"><h1 class="font-h font-800 text-xl mb-0.5">Selamat datang, ${tName}</h1><p class="text-xs mb-5" style="color:var(--tx3)">${td()} | SMT ${A.sess.semester} - TP ${A.sess.tahunPelajaran}</p><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">`;

    h+=`</div><div class="cd"><div class="flex items-center justify-between mb-2.5"><h3 class="font-h font-700 text-sm">Progress Materi ${isOrtu?'Anak':''}</h3><span class="text-xs font-700" style="color:var(--g1)">${s.persenProgress}%</span></div><div class="w-full h-3 rounded-full overflow-hidden" style="background:var(--gxxl)"><div class="h-full rounded-full transition-all" style="background:linear-gradient(90deg,var(--g1),var(--y1));width:${s.persenProgress}%"></div></div><p class="text-[11px] mt-1.5" style="color:var(--tx3)">${s.materiSelesai} dari ${s.totalMateri} materi selesai</p></div>`;
  }else{
    h+=st('fa-users','Siswa',s.totalSiswa,'var(--g1)'); h+=st('fa-book','Mapel',s.totalMapel,'var(--y1)'); h+=st('fa-file-lines','Tugas',s.totalTugas,'var(--g4)'); h+=st('fa-clock','Belum Dinilai',s.belumDinilai,'#EF4444');

  }
  return h+'</div>';
}

async function pMt(){
  const[rm,rp]=await Promise.all([api('getMapel',{kelas:A.u.Kelas}),api('getProgress',{email:A.u.Email})]);
  if(!rm.success)return empty('fa-triangle-exclamation',rm.message);
  A.d.mapel=rm.data; if(!rm.data.length)return empty('fa-book-open','Belum ada mata pelajaran');
  A.d.progress=rp.success?rp.data:[];
  const mR=await Promise.all(rm.data.map(mp=>api('getMateriByMapel',{idMapel:mp.IDMapel})));
  let h=`<div class="fi-in"><h1 class="font-h font-800 text-xl mb-0.5">Materi Pelajaran</h1><p class="text-xs mb-5" style="color:var(--tx3)">Akses materi belajar Anda di sini</p>`;
  rm.data.forEach((mp,mi)=>{
    const items=(mR[mi].success?mR[mi].data:[]); if(!items.length)return;
    const babs={}; items.forEach(m=>{if(!babs[m.Bab])babs[m.Bab]=[];babs[m.Bab].push(m)});
    h+=`<div class="cd mb-3"><h2 class="font-h font-700 text-sm mb-3 flex items-center gap-2"><div class="w-6 h-6 rounded-md flex items-center justify-center" style="background:var(--gxxl)"><i class="fas fa-book text-[10px]" style="color:var(--g1)"></i></div>${mp.NamaMapel}</h2>`;

      h+=`<p class="text-[10.5px] font-700 uppercase tracking-wider mb-2 mt-1 text-gray-500">${bab}</p><div class="space-y-2">`;
      bi.forEach(m=>{
        const done=A.d.progress.find(p=>p.IDMateri===m.IDMateri&&p.Status==='Selesai');
        h+=`<div class="rounded-lg p-3 flex flex-col sm:flex-row sm:items-center gap-2.5" style="border:1px solid var(--bd)"><div class="flex-1 min-w-0"><p class="font-600 text-sm">${m.Judul}</p>${m.Deskripsi?`<p class="text-[11px] mt-0.5 text-gray-500 line-clamp-1">${m.Deskripsi}</p>`:''}</div><div class="flex items-center gap-1.5 flex-shrink-0 flex-wrap">${m.PdfUrl?`<button class="bt bt2 bts" onclick="opV('${esc(m.Judul)}','${drP(m.PdfUrl)}')"><i class="fas fa-file-pdf"></i> PDF</button>`:''}${m.YoutubeUrl?`<button class="bt bt2 bts" onclick="opV('${esc(m.Judul)}','${ytE(m.YoutubeUrl)}')"><i class="fas fa-play"></i> Video</button>`:''}<button class="bt ${done?'bt1':'bt2'} bts" id="mb_${m.IDMateri}" ${done?'disabled':''} onclick="mDn('${m.IDMateri}',this)"><i class="fas ${done?'fa-check-circle':'fa-circle'}"></i> ${done?'Selesai':'Tandai'}</button></div></div>`;
      }); h+=`</div>`;
    } h+=`</div>`;
  });
  return h+'</div>';
}

function pO(qi,opt){if(A.qs.s)return;A.qs.a[qi]=opt;const L=['A','B','C','D'];document.getElementById('q'+qi).querySelectorAll('.qo').forEach((e,j)=>e.classList.toggle('sel',L[j]===opt))}

  if(A.qs.s)return;const t=A.d.soal.length; if(t-Object.keys(A.qs.a).length>0){toast('Belum semua soal dijawab','warning');return}

async function pJgAnak(){

  return `<div class="fi-in"><div class="mb-5"><h1 class="font-h font-800 text-xl mb-0.5">Jurnal Kelas</h1><p class="text-xs text-gray-500">Aktivitas kelas ${A.u.KelasAnak}</p></div><div id="jgCA">${rJGListAnak(A._jgData)}</div></div>`;

function rJGListAnak(data){
  if(!data.length)return empty('fa-book','Belum ada jurnal untuk kelas ini');
  const sorted=[...data].sort((a,b)=>(b.Tanggal||'').localeCompare(a.Tanggal||''));
  const limit=10;const tp=Math.ceil(sorted.length/limit);if(A.jgPage>tp&&tp>0)A.jgPage=tp;
  const pageData=sorted.slice((A.jgPage-1)*limit,A.jgPage*limit);
  let h=`<div class="space-y-2">`;
  pageData.forEach(j=>{h+=`<div class="cd"><div class="flex items-center gap-1.5 flex-wrap mb-0.5"><span class="text-xs font-700 text-blue-600">${fmtDS(j.Tanggal)}</span><span class="bd bg2">${j.NamaMapel||'-'}</span></div><p class="text-sm font-600">${j.MateriYangDiajarkan||'-'}</p><p class="text-[11px] text-gray-500"><i class="fas fa-clock mr-0.5"></i>${j.WaktuMulai||'-'} — ${j.WaktuSelesai||'-'} | Guru: ${j.NamaGuru||'-'}</p></div>`});
  h+='</div>';
  if(tp>1){h+=`<div class="flex items-center justify-center gap-1 mt-4"><button class="pag-btn" onclick="jgPgA(${A.jgPage-1})" ${A.jgPage<=1?'disabled':''}><i class="fas fa-chevron-left text-[10px]"></i></button>`;for(let p=1;p<=tp;p++)h+=`<button class="pag-btn ${p===A.jgPage?'act':''}" onclick="jgPgA(${p})">${p}</button>`;h+=`<button class="pag-btn" onclick="jgPgA(${A.jgPage+1})" ${A.jgPage>=tp?'disabled':''}><i class="fas fa-chevron-right text-[10px]"></i></button></div>`}
  return h;
}
function jgPgA(p){if(p<1)return;A.jgPage=p;document.getElementById('jgCA').innerHTML=rJGListAnak(A._jgData);}

    });

async function pNl(){
  const[rm,rt,rj]=await Promise.all([api('getMapel'),api('getTugas'),api('getJawabanTugas')]);
  A.d.mapel=rm.success?rm.data:[]; const tugas=rt.success?rt.data:[]; const jawaban=(rj.success?rj.data:[]).map(normJ);
  const mm={}; A.d.mapel.forEach(m=>mm[m.IDMapel]=m.NamaMapel);
  const ugCount={}; jawaban.forEach(j=>{const nv=j.nilai;if(nv===''||nv===null)ugCount[j.idtugas]=(ugCount[j.idtugas]||0)+1;});
  A._nl={tugas,jawaban,mm,ugCount,loaded:{}};
  let h=`<div class="fi-in"><h1 class="font-h font-800 text-xl mb-5">Penilaian Tugas</h1><select class="fi mb-3" id="nlF" onchange="nlFilter()"><option value="">Semua Mapel</option>${A.d.mapel.map(m=>`<option value="${m.IDMapel}">${m.NamaMapel}</option>`).join('')}</select><div id="nlC">`;
  h+=rNlCards(tugas,mm,ugCount); h+=`</div></div>`; return h;
}
function rNlCards(tugas,mm,ugCount){
  if(!tugas.length)return empty('fa-star','Belum ada tugas'); let h='';
  tugas.forEach(t=>{
    const ug=ugCount[t.IDTugas]||0; const tp=t.Tipe||'Individu';
    h+=`<div class="cd mb-2 cursor-pointer" onclick="togNlSub('${t.IDTugas}')"><div class="flex justify-between items-center"><div class="flex-1"><div class="flex items-center gap-1.5 mb-1"><h3 class="font-h font-700 text-sm">${t.Judul}</h3><span class="bd bg1">${mm[t.IDMapel]||'-'}</span><span class="bd bg4">${t.Kelas}</span></div><p class="text-[11px] text-gray-500">Tenggat: ${fmtDS(t.Tenggat)}</p></div><div>${ug>0?`<span class="bd bg3">${ug} belum dinilai</span>`:`<span class="bd bgg">Selesai</span>`}</div></div></div><div id="nlS_${t.IDTugas}" class="hidden"></div>`;
  }); return h;
}
function nlFilter(){
  const fv=document.getElementById('nlF').value; let f=A._nl.tugas; if(fv)f=f.filter(t=>t.IDMapel===fv);
  document.getElementById('nlC').innerHTML=rNlCards(f,A._nl.mm,A._nl.ugCount); A._nl.loaded={};
}
async function togNlSub(id){
  const sub=document.getElementById('nlS_'+id); if(!sub.classList.contains('hidden')){sub.classList.add('hidden');return;}
  sub.classList.remove('hidden'); if(A._nl.loaded[id])return;
  sub.innerHTML=`<div class="cd mb-2 bg-gray-50" style="padding:16px">${sk(10)}</div>`;
  const jw=A._nl.jawaban.filter(j=>String(j.idtugas)===String(id)); A._nl.loaded[id]=true;
  if(!jw.length){sub.innerHTML=`<div class="cd mb-2 bg-gray-50"><p class="text-xs text-center text-gray-500">Belum ada pengumpulan</p></div>`;return;}
  let h=`<div class="cd mb-2 bg-gray-50" style="padding:16px"><div class="space-y-2">`;
  jw.forEach(j=>{
    const isGraded=j.nilai!==''&&j.nilai!==null; const anggota=j.listnamaanggota?j.listnamaanggota.split(',').join(', '):'';
    h+=`<div class="p-3 bg-white border border-gray-200 rounded-lg flex justify-between items-start gap-3"><div class="flex-1"><p class="font-600 text-sm">${j.namapengumpul}</p><p class="text-[11px] text-gray-500">${j.emailpengumpul}</p>${anggota?`<p class="text-[10px] text-blue-600 mt-1"><i class="fas fa-users"></i> ${anggota}</p>`:''}${j.linkjawaban?`<a href="${j.linkjawaban}" target="_blank" class="text-[11px] text-blue-600 mt-1 inline-block"><i class="fas fa-link"></i> Link Jawaban</a>`:''}</div>`;
    if(isGraded){
      h+=`<div class="text-right"><p class="font-h font-800 text-xl text-blue-600">${j.nilai}</p><p class="text-[10px] text-gray-500 mb-1">${j.catatanguru||''}</p><button class="text-xs text-red-500" onclick="cfDel('Reset nilai?',async()=>{const r=await api('deleteNilaiTugas',{id:'${j.id}'});if(r.success){cc();invCache(['getJawabanTugas']);toast(r.message);nav('penilaian')}else toast(r.message,'error')})">Reset</button></div>`;
    }else{
      h+=`<div class="flex flex-col items-end gap-1"><input type="number" class="fi" style="width:70px;padding:4px" placeholder="Nilai" id="nv_${j.id}"><input class="fi" style="width:120px;padding:4px" placeholder="Catatan" id="nc_${j.id}"><button class="bt bt1 bts" onclick="nlSm('${j.idtugas}','${j.emailpengumpul}','${j.id}')">Simpan</button></div>`;
    } h+=`</div>`;
  }); h+=`</div></div>`; sub.innerHTML=h;
}

function dlAbsPdf(){

async function pYS(){
  const [ra, rnk, rt, rk] = await Promise.all([
    api('getRiwayatAbsen',{}), 
    api('getNilaiKarakter',{semua:true, semester:A.sess.semester, tahunPelajaran:A.sess.tahunPelajaran}), 
    api('getJawabanTugas',{}),
    api('getNilaiKuis',{})
  ]);
  
  const abs = ra.success?ra.data.map(normJ):[]; 
  const kar = rnk.success?rnk.data.map(normJ):[]; 
  const jwb = rt.success?rt.data.map(normJ):[];
  const kuis = rk.success?rk.data.map(normJ):[];

  // 1. CHART DATA (Attendance Grouped by Date)
  const dtMap = {};
  abs.forEach(a=>{
      if(!a.tanggal) return;
      const t = a.tanggal.substring(0,10);
      if(!dtMap[t]) dtMap[t] = {h:0,s:0,i:0,a:0};
      const st = (a.status||'').toLowerCase();
      if(st==='hadir') dtMap[t].h++; else if(st==='sakit') dtMap[t].s++; else if(st==='izin') dtMap[t].i++; else if(st==='alpha') dtMap[t].a++;
  });
  const sortedDates = Object.keys(dtMap).sort();
  A._chartData = {
      labels: sortedDates.map(fmtDS),
      h: sortedDates.map(d=>dtMap[d].h),
      s: sortedDates.map(d=>dtMap[d].s),
      i: sortedDates.map(d=>dtMap[d].i),
      a: sortedDates.map(d=>dtMap[d].a)
  };

  // 2. Rata-rata Akademik (Tugas + Kuis)
  let sumAk = 0, countAk = 0;
  jwb.forEach(j=>{ if(j.nilai!==''&&j.nilai!==null){ sumAk+=Number(j.nilai); countAk++; } });
  kuis.forEach(k=>{ if(k.skor!==''&&k.skor!==null){ sumAk+=Number(k.skor); countAk++; } });
  const avgAk = countAk>0 ? Math.round(sumAk/countAk) : 0;

  // 3. Rata-rata Karakter
  let sumKG = 0, cKG = 0, sumKO = 0, cKO = 0;
  kar.forEach(k=>{
      const v = Number(k.nilai);
      if(isNaN(v)) return;
      if(k.penilai==='Guru') { sumKG+=v; cKG++; }
      else if(k.penilai==='Ortu') { sumKO+=v; cKO++; }
  });
  const avgKG = cKG>0 ? (sumKG/cKG).toFixed(2) : 0;
  const avgKO = cKO>0 ? (sumKO/cKO).toFixed(2) : 0;

  let h=`<div class="fi-in"><h1 class="font-h font-800 text-xl mb-5">Statistik Global Siswa</h1>`;
  
  h+=`<div class="cd mb-4"><h3 class="font-h font-700 text-sm mb-3">Grafik Kehadiran Siswa</h3><div style="height:300px; width:100%"><canvas id="ygChart"></canvas></div></div>`;
  
  h+=`<div class="grid grid-cols-1 md:grid-cols-3 gap-4">`;
  h+=`<div class="cd flex flex-col items-center justify-center text-center"><h3 class="font-h font-700 text-sm mb-2 text-indigo-800">Rata-rata Akademik</h3><div class="w-20 h-20 rounded-full border-4 border-indigo-100 flex items-center justify-center mb-2"><span class="font-h font-800 text-2xl text-indigo-600">${avgAk}</span></div><p class="text-xs text-gray-500">Tugas & Kuis (${countAk} data)</p></div>`;
  h+=`<div class="cd flex flex-col items-center justify-center text-center"><h3 class="font-h font-700 text-sm mb-2 text-emerald-800">Karakter (Penilaian Guru)</h3><div class="w-20 h-20 rounded-full border-4 border-emerald-100 flex items-center justify-center mb-2"><span class="font-h font-800 text-2xl text-emerald-600">${avgKG}</span></div><p class="text-xs text-gray-500">Rata-rata Skala 1 - 4</p></div>`;
  h+=`<div class="cd flex flex-col items-center justify-center text-center"><h3 class="font-h font-700 text-sm mb-2 text-amber-800">Karakter (Penilaian Ortu)</h3><div class="w-20 h-20 rounded-full border-4 border-amber-100 flex items-center justify-center mb-2"><span class="font-h font-800 text-2xl text-amber-600">${avgKO}</span></div><p class="text-xs text-gray-500">Rata-rata Skala 1 - 4</p></div>`;
  h+=`</div></div>`;

  setTimeout(drawChartYS, 200);
  return h;
}

function drawChartYS(){
  const ctx = document.getElementById('ygChart');
  if(!ctx) return;
  if(window.ysChartInst) window.ysChartInst.destroy();
  
  if(!A._chartData.labels.length) {
    ctx.parentElement.innerHTML = `<div class="text-center py-12"><p class="text-sm text-gray-500"><i class="fas fa-chart-line text-2xl mb-2 text-gray-300 block"></i>Belum ada data kehadiran siswa</p></div>`;
    return;
  }
  
  window.ysChartInst = new Chart(ctx, {
      type: 'line',
      data: {
          labels: A._chartData.labels,
          datasets: [
              { label: 'Hadir', data: A._chartData.h, borderColor: '#059669', backgroundColor: 'rgba(5, 150, 105, 0.1)', fill: true, tension: 0.3 },
              { label: 'Sakit', data: A._chartData.s, borderColor: '#F59E0B', backgroundColor: 'transparent', tension: 0.3 },
              { label: 'Izin', data: A._chartData.i, borderColor: '#3B82F6', backgroundColor: 'transparent', tension: 0.3 },
              { label: 'Alpha', data: A._chartData.a, borderColor: '#EF4444', backgroundColor: 'transparent', tension: 0.3 }
          ]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' }
        },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
  });
}

</script>
</body>
</html>
