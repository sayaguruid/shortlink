function normJ(j){if(!j||typeof j!=='object')return j;const o={};for(const k of Object.keys(j)){const lk=k.toLowerCase().replace(/[\s_\-]+/g,'');o[lk]=j[k]}return o}
function fmtDS(iso){if(!iso)return'-';let s=String(iso);if(s.includes('T'))s=s.split('T')[0];let p=s.split('-');if(p.length===3){const bl=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return parseInt(p[2])+' '+bl[parseInt(p[1])-1]+' '+p[0]}return iso}
function fmtTime(v){if(!v)return'-';if(typeof v==='string'&&v.includes(':'))return v.substring(0,5);if(v instanceof Date){return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0')}if(typeof v==='number'){const h=Math.floor(v*24);const m=Math.round((v*24-h)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}return '-'}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function drP(u){if(!u)return '';if(u.includes('drive.google.com')){let m=u.match(/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;return u.replace(/\/view(\?|$)/,'/preview$1').replace(/\/edit(\?|$)/,'/preview$1')}return u}

function createMultiSelect(containerId, options, selectedVals=[], placeholder='Pilih...'){
  const cont = document.getElementById(containerId); if(!cont)return;
  let sel = [...selectedVals];
  function render(){
    cont.innerHTML=`<div class="ms-wrap" id="${containerId}_wrap">
      ${sel.map(v=>{const o=options.find(x=>x.v==v);return o?`<span class="ms-pill">${o.l}<span class="rm" data-v="${v}" onclick="msRemove('${containerId}','${v}')">&times;</span></span>`:''}).join('')}
      <span class="text-xs text-slate-400 ml-1">${sel.length===0?placeholder:''}</span>
    </div>
    <div class="ms-dropdown" id="${containerId}_dd">
      ${options.map(o=>`<div class="ms-opt${sel.includes(String(o.v))?'selected':''}" onclick="msToggle('${containerId}','${o.v}','${esc(o.l)}')">${sel.includes(String(o.v))?'<i class="fas fa-check text-blue-600 text-xs"></i>':''}<span>${o.l}</span></div>`).join('')}
    </div>`;
    cont.dataset.sel=JSON.stringify(sel);
  }
  window[containerId+'_opts']=options;
  window.msToggle=function(cid,v,l){
    const c=document.getElementById(cid);const s=JSON.parse(c.dataset.sel||'[]');const idx=s.indexOf(String(v));
    if(idx>-1)s.splice(idx,1);else s.push(String(v));c.dataset.sel=JSON.stringify(s);sel=s;
    window[cid+'_sel']=s;render();
  };
  window.msRemove=function(cid,v){window.msToggle(cid,v,'')};
  window[containerId+'_get']=()=>JSON.parse(cont.dataset.sel||'[]');
  render();
}

async function api(a,d={}){
  d.action=a; const k=JSON.stringify({a,d}); const isMut=_sk.includes(a);
  if(!isMut&&_c[k])return _c[k];
  _pendingCount++;
  const gl=document.getElementById('glLoader'); gl.classList.add('on');
  document.getElementById('glLoaderText').textContent=d.fileData?'Mengunggah file...':'Memproses...';
  try{
    const r=await fetch(SU,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});
    const j=await r.json(); if(!isMut)_c[k]=j;
    _pendingCount--; if(_pendingCount<=0){_pendingCount=0;gl.classList.remove('on')}
    return j;
  }catch(e){_pendingCount--;if(_pendingCount<=0){_pendingCount=0;gl.classList.remove('on')};return{success:false,message:'Koneksi gagal: '+e.message}}
}

  const currentMaps=String(t.IDMapel).split(',').map(x=>x.trim());const mainM=currentMaps[0];
  const isProject=A.d.mapel.find(x=>x.IDMapel==mainM)?.NamaMapel.toLowerCase().includes('project');
  api('getKelasList').then(r=>{
    const kl=r.success?r.data:[];
    opM('Edit Tugas',`<div class="space-y-3">
      <div><label class="fl">Mapel</label><select id="tgM" class="fi" onchange="tgTogInteg(this.value)">${so(A.d.mapel.map(m=>({v:m.IDMapel,l:m.NamaMapel})),mainM)}</select></div>
      <div id="tgInteg" style="display:${isProject?'block':'none'}">
        <label class="fl">Mapel Terintegrasi</label>
        <div class="grid grid-cols-2 gap-1.5 max-h-32 overflow-y-auto p-2 border rounded-lg">
          ${A.d.mapel.filter(m=>!m.NamaMapel.toLowerCase().includes('project')).map(m=>`<label class="flex items-center gap-2 text-sm p-1 rounded cursor-pointer hover:bg-gray-50"><input type="checkbox" class="tgM_cb accent-blue-600" value="${m.IDMapel}"${currentMaps.includes(String(m.IDMapel))?' checked':''}> ${m.NamaMapel}</label>`).join('')}
        </div>
      </div>
      <div><label class="fl">Kelas</label><select id="tgK" class="fi"><option value="">-- Pilih --</option>${kl.map(k=>`<option value="${k}"${k===t.Kelas?' selected':''}>${k}</option>`).join('')}</select></div>
      <div><label class="fl">Judul</label><input id="tgJ" class="fi" value="${t.Judul}"></div>
      <div><label class="fl">Tenggat</label><input id="tgT" type="date" class="fi" value="${t.Tenggat}"></div>
      <div><label class="fl">Tipe</label><select id="tgTp" class="fi">${so([{v:'Individu',l:'Individu'},{v:'Kelompok',l:'Kelompok'}],t.Tipe)}</select></div>
    </div>`,`<button class="bt bt2" onclick="clM()">Batal</button><button class="bt bt1" onclick="smETg('${id}')"><i class="fas fa-save"></i> Simpan</button>`);
  });
}
async function smETg(id){
  let idM=document.getElementById('tgM').value;const m=A.d.mapel.find(x=>x.IDMapel==idM);
  if(m&&m.NamaMapel.toLowerCase().includes('project')){const integ=Array.from(document.querySelectorAll('.tgM_cb:checked')).map(cb=>cb.value).join(', ');if(integ)idM+=', '+integ}
  const kelas=document.getElementById('tgK').value,judul=document.getElementById('tgJ').value.trim(),tenggat=document.getElementById('tgT').value,tipe=document.getElementById('tgTp').value;
  const r=await api('updateTugas',{id,idMapel:idM,kelas,judul,deskripsi:'',tenggat,tipe});
  if(r.success){clM();invCache(['getTugas']);toast(r.message);ldTg()}else toast(r.message,'error');
}

async function pNl(){
  const[rm,rt,rj]=await Promise.all([api('getMapel'),api('getTugas'),api('getJawabanTugas')]);
  A.d.mapel=rm.success?rm.data:[];const tugas=rt.success?rt.data:[];const jawaban=(rj.success?rj.data:[]).map(normJ);
  const mm={};A.d.mapel.forEach(m=>mm[m.IDMapel]=m.NamaMapel);
  const ugCount={};jawaban.forEach(j=>{const nv=j.nilai;if(nv===''||nv===null||nv===undefined)ugCount[j.idtugas]=(ugCount[j.idtugas]||0)+1});
  A._nl={tugas,jawaban,mm,ugCount,loaded:{}};
  return`<div><h1 class="font-h font-800 text-xl mb-4">Penilaian Tugas</h1>
  <select class="fi mb-3" id="nlF" onchange="nlFilter()"><option value="">Semua Mapel</option>${A.d.mapel.map(m=>`<option value="${m.IDMapel}">${m.NamaMapel}</option>`).join('')}</select>
  <div id="nlC">${rNlCards(tugas,mm,ugCount)}</div></div>`;
}
function rNlCards(tugas,mm,ugCount){
  if(!tugas.length)return empty('fa-star','Belum ada tugas');let h='';
  tugas.forEach(t=>{const ug=ugCount[t.IDTugas]||0;const mIds=String(t.IDMapel).split(',').map(x=>x.trim());const mNames=mIds.map(id=>mm[id]||id).join(', ');
    h+=`<div class="cd mb-2 cursor-pointer" onclick="togNlSub('${t.IDTugas}')"><div class="flex justify-between items-center gap-2"><div class="flex-1"><div class="flex items-center gap-1.5 flex-wrap mb-0.5"><h3 class="font-h font-700 text-sm">${t.Judul}</h3><span class="bd-tag bg1 text-xs">${mNames}</span><span class="bd-tag bg4 text-xs">${t.Kelas}</span></div></div><span class="bd-tag ${ug>0?'bg3':'bgg'} flex-shrink-0">${ug>0?ug+' belum dinilai':'Selesai'}</span></div></div><div id="nlS_${t.IDTugas}" class="hidden"></div>`;
  });return h;
}
function nlFilter(){const fv=document.getElementById('nlF').value;let f=A._nl.tugas;if(fv)f=f.filter(t=>String(t.IDMapel).includes(fv));document.getElementById('nlC').innerHTML=rNlCards(f,A._nl.mm,A._nl.ugCount);A._nl.loaded={}}
async function togNlSub(id){const sub=document.getElementById('nlS_'+id);if(!sub.classList.contains('hidden')){sub.classList.add('hidden');return}sub.classList.remove('hidden');if(A._nl.loaded[id])return;sub.innerHTML=`<div class="cd mb-2 bg-gray-50">${sk(10)}</div>`;
  const jw=A._nl.jawaban.filter(j=>String(j.idtugas)===String(id));A._nl.loaded[id]=true;
  if(!jw.length){sub.innerHTML=`<div class="cd mb-2 bg-gray-50"><p class="text-xs text-center text-gray-500 py-2">Belum ada pengumpulan</p></div>`;return}
  let h=`<div class="cd mb-2" style="background:#f8fafc"><div class="space-y-2">`;
  jw.forEach(j=>{const isGraded=j.nilai!==''&&j.nilai!==null&&j.nilai!==undefined;
    h+=`<div class="p-3 bg-white border rounded-lg flex justify-between items-start gap-3"><div class="flex-1"><p class="font-600 text-sm">${j.namapengumpul||j.emailpengumpul}</p>${j.linkjawaban?`<a href="${j.linkjawaban}" target="_blank" class="text-[11px] text-blue-600 mt-1 inline-block"><i class="fas fa-link"></i> Lihat Jawaban</a>`:''}</div>`;
    if(isGraded)h+=`<div class="text-right flex-shrink-0"><p class="font-h font-800 text-xl text-blue-600">${j.nilai}</p><button class="text-[10px] text-red-500" onclick="cfDel('Reset nilai?',async()=>{const r=await api('deleteNilaiTugas',{id:'${j.id}'});if(r.success){invCache(['getJawabanTugas']);toast(r.message);nav('penilaian')}})">Reset</button></div>`;
    else h+=`<div class="flex items-center gap-1.5 flex-shrink-0"><input type="number" class="fi" style="width:65px;padding:5px" placeholder="0-100" id="nv_${j.id}" min="0" max="100"><button class="bt bt1 bts" onclick="nlSm('${j.idtugas}','${j.emailpengumpul}','${j.id}')">Simpan</button></div>`;
    h+=`</div>`;
  });
  sub.innerHTML=h+`</div></div>`;
}
async function nlSm(idTugas,em,id){const v=document.getElementById('nv_'+id).value;if(v===''||isNaN(v)||Number(v)<0||Number(v)>100){toast('Nilai 0-100','warning');return}const r=await api('nilaiTugas',{idTugas,emailPengumpul:em,nilai:Number(v),catatanGuru:''});if(r.success){invCache(['getJawabanTugas']);toast(r.message);nav('penilaian')}else toast(r.message,'error')}

async function ldAbSiswa(){

  if(cd.success&&cd.duplicate){c.innerHTML=`<div class="danger-box"><i class="fas fa-ban"></i><p>${cd.message}</p></div>`;return}
  const rs=await api('getSiswaByKelas',{kelas:k});const siswa=rs.success?rs.data.filter(u=>u.Role==='Siswa'):[];

  siswa.forEach(s=>{h+=`<div class="flex items-center gap-3 p-2 rounded-lg border"><div class="flex-1"><p class="text-sm font-500">${s.Nama}</p></div><select class="fi ab-st" data-e="${s.Email}" data-n="${esc(s.Nama)}" style="width:100px"><option value="Hadir">Hadir</option><option value="Sakit">Sakit</option><option value="Izin">Izin</option><option value="Alpha">Alpha</option></select></div>`});

async function smAb(mapelList,kelas,tanggal){
  const list=[];document.querySelectorAll('.ab-st').forEach(s=>list.push({email:s.dataset.e,nama:s.dataset.n,status:s.value}));
  let ok=0;
  for(const idMapel of mapelList){const r=await api('submitAbsensi',{idMapel,kelas,tanggal,list});if(r.success)ok++}
  if(ok>0){invCache(['getRiwayatAbsen']);toast('Absensi tersimpan untuk '+ok+' mapel');document.getElementById('abC').innerHTML=`<div class="info-box"><i class="fas fa-check-circle"></i><p>Absensi berhasil disimpan untuk ${ok} mata pelajaran.</p></div>`}else toast('Gagal menyimpan','error');
}

function rRA(){
  const c=document.getElementById('raC'),data=A.raData;if(!data.length){c.innerHTML=empty('fa-clock','Tidak ada data');return}
  const rekap={};data.forEach(a=>{const k=a.namasiswa||a.emailsiswa;if(!rekap[k])rekap[k]={nama:a.namasiswa||a.emailsiswa,kelas:a.kelas,H:0,S:0,I:0,A:0};if(a.status==='Hadir')rekap[k].H++;else if(a.status==='Sakit')rekap[k].S++;else if(a.status==='Izin')rekap[k].I++;else rekap[k].A++});
  let h=`<div class="cd mb-4"><h3 class="font-h font-700 text-sm mb-3">Rekap Kehadiran per Siswa</h3><div class="overflow-x-auto"><table class="tb"><thead><tr><th>Nama</th><th>Kelas</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpha</th><th>Total</th></tr></thead><tbody>`;
  Object.values(rekap).forEach(r=>{const tot=r.H+r.S+r.I+r.A;h+=`<tr><td class="font-600">${r.nama}</td><td>${r.kelas}</td><td><span class="bd-tag bgg">${r.H}</span></td><td><span class="bd-tag bgy">${r.S}</span></td><td><span class="bd-tag bg2">${r.I}</span></td><td><span class="bd-tag bg3">${r.A}</span></td><td class="font-600">${tot}</td></tr>`});
  h+=`</tbody></table></div></div>`;
  const bk={};data.forEach(a=>{const k=a.kelas||'-';if(!bk[k])bk[k]=[];bk[k].push(a)});
  for(const[k,items]of Object.entries(bk)){
    h+=`<div class="cd mb-3"><h3 class="font-h font-700 text-sm mb-2">Kelas ${k}</h3><div class="overflow-x-auto"><table class="tb"><thead><tr><th>Nama</th><th>Tanggal</th><th>Status</th></tr></thead><tbody>`;

    h+=`</tbody></table></div></div>`;
  }
  c.innerHTML=h;
}
async function dlAbsPdf(){
  const data=A.raData;if(!data.length){toast('Tidak ada data','warning');return}
  const{jsPDF}=window.jspdf;const doc=new jsPDF('p','mm','a4');let y=15;
  if(LOGO_B64)try{doc.addImage(LOGO_B64,'JPEG',15,y,18,18)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('LAPORAN ABSENSI SISWA',105,y+7,{align:'center'});y+=24;
  const rekap={};data.forEach(a=>{const k=a.namasiswa||a.emailsiswa;if(!rekap[k])rekap[k]={nama:a.namasiswa||a.emailsiswa,kelas:a.kelas,H:0,S:0,I:0,A:0};if(a.status==='Hadir')rekap[k].H++;else if(a.status==='Sakit')rekap[k].S++;else if(a.status==='Izin')rekap[k].I++;else rekap[k].A++});
  doc.autoTable({startY:y,head:[['Nama','Kelas','Hadir','Sakit','Izin','Alpha']],body:Object.values(rekap).map(r=>[r.nama,r.kelas,r.H,r.S,r.I,r.A]),theme:'grid',styles:{fontSize:8}});
  previewPdf(doc,'Absensi.pdf');
}

  const I=data.filter(j=>(j.StatusGuru||j.statusguru||'')==='Izin').length;
  return st('fa-check-circle','Hadir',H,'#059669')+st('fa-briefcase-medical','Sakit',S,'var(--y1)')+st('fa-door-open','Izin',I,'var(--g4)');

  const bulan=type==='Ortu'?document.getElementById('kgB')?.value:'';
  const area=document.getElementById('kgFormArea');area.innerHTML=sk(10);
  const[rt,rn]=await Promise.all([api('getTargetKarakter',{semester:A.sess.semester,kelas,bulan}),api('getNilaiKarakter',{emailSiswa:email,semua:true,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran,bulan})]);
  const targets=type==='Guru'?(rt.success?rt.dataGuru.map(normJ):[]):(rt.success?rt.dataOrtu.map(normJ):[]);
  const nilais=rn.success?rn.data.map(normJ):[];
  let h=`<div class="cd"><h3 class="font-h font-700 text-sm mb-3">Penilaian Karakter — ${type==='Guru'?'Oleh Guru':'Oleh Orang Tua'}</h3>`;
  if(!targets.length){h+=`<div class="warn-box"><i class="fas fa-info-circle text-yellow-600"></i><p>Belum ada target karakter untuk ${type==='Guru'?'Guru':'Orang Tua'}. Tambahkan di menu Target Karakter.</p></div>`}
  else{
    h+=`<div class="space-y-4">`;
    const byBidang={};targets.forEach(t=>{const b=t.bidang||'Umum';if(!byBidang[b])byBidang[b]=[];byBidang[b].push(t)});
    for(const[bidang,items]of Object.entries(byBidang)){
      h+=`<div><p class="text-xs font-700 text-blue-700 mb-2 uppercase tracking-wide">${bidang}</p>`;
      items.forEach(t=>{
        const idT=t.id||t.idkarakter;const v=nilais.find(n=>String(n.idtarget)===String(idT)&&String(n.penilai).toLowerCase()===type.toLowerCase())?.nilai;
        h+=`<div class="p-3 border rounded-lg mb-2"><p class="text-sm mb-2">${t.target}</p><div class="flex gap-2 flex-wrap">`;
        [1,2,3,4].forEach(n=>{h+=`<label class="text-center cursor-pointer"><div class="kar-score${v==n?' sel':''}" onclick="selKar(this,'kar_${idT}',${n})">${n}</div><input type="radio" name="kar_${idT}" value="${n}" ${v==n?'checked':''} style="display:none"><div class="kar-desc">${['PB','MB','BSH','SB'][n-1]}</div></label>`});
        h+=`</div></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  h+=`<button class="bt bt1 mt-3 w-full justify-center" onclick="svKg()"><i class="fas fa-save"></i> Simpan Penilaian</button></div>`;
  area.innerHTML=h;
}
function selKar(el,name,val){document.querySelectorAll('.kar-score[data-name="'+name+'"]').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');el.dataset.name=name;const inp=document.querySelector(`input[name="${name}"][value="${val}"]`);if(inp)inp.checked=true}
async function svKg(){
  const type=document.getElementById('kgType').value;const bulan=type==='Ortu'?document.getElementById('kgB')?.value:'';
  const list=[];document.querySelectorAll('#kgFormArea input[type="radio"]:checked').forEach(i=>list.push({idTarget:i.name.replace('kar_',''),nilai:i.value}));
  const r=await api('submitKarakter',{emailSiswa:document.getElementById('kgS').value,type,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran,bulan,list});
  if(r.success){invCache(['getNilaiKarakter']);toast('Penilaian karakter tersimpan')}else toast(r.message,'error');
}

async function ldPkgData(){

  const[rt,rn]=await Promise.all([api('getTargetKarakter',{semester:A.sess.semester}),api('getNilaiKarakter',{emailSiswa:email,semua:true,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran})]);
  const tO=rt.success?rt.dataOrtu.map(normJ):[];const nilais=rn.success?rn.data.map(normJ):[];
  if(!tO.length){c.innerHTML=`<div class="warn-box"><i class="fas fa-info-circle text-yellow-600"></i><p>Belum ada target karakter untuk Orang Tua.</p></div>`;return}

  tO.forEach(t=>{const idT=t.id||t.idkarakter;const nObj=nilais.find(n=>String(n.idtarget)===String(idT)&&String(n.penilai).toLowerCase().includes('ortu'));const v=nObj?nObj.nilai:'-';const bulan=nObj?(nObj.bulan||'-'):'-';h+=`<tr><td class="text-sm">${t.target}</td><td>${bulan}</td><td>${v!=='-'?`<span class="bd-tag bgg">${v}</span>`:'<span class="bd-tag bg4">-</span>'}</td><td class="text-xs">${lblMap[v]||'-'}</td></tr>`});

async function stK(){

function pO(qi,opt){if(A.qs.s)return;A.qs.a[qi]=opt;const L=['A','B','C','D'];document.getElementById('q'+qi).querySelectorAll('.qo').forEach((e,j)=>e.classList.toggle('sel',L[j]===opt))}
async function smK(id,bab){
  if(A.qs.s)return;const t=A.d.soal.length;if(t-Object.keys(A.qs.a).length>0){toast('Isi semua soal','warning');return}
  A.qs.s=true;let b=0;const L=['A','B','C','D'];
  A.d.soal.forEach((s,i)=>{const an=A.qs.a[i];document.getElementById('q'+i).querySelectorAll('.qo').forEach((e,j)=>{if(L[j]===s.KunciJawaban)e.classList.add('ok');if(L[j]===an&&an!==s.KunciJawaban)e.classList.add('no')});if(an===s.KunciJawaban)b++});
  const sk=Math.round((b/t)*100);await api('submitKuis',{idMapel:id,bab,email:A.u.Email,nama:A.u.Nama,skor:sk});invCache(['getNilaiKuis','getStats']);toast('Skor: '+sk+'  ('+b+'/'+t+' benar)');
}

async function pTg(){
  const isOrtu=A.u.Role==='Orang Tua';const kls=isOrtu?A.u.KelasAnak:A.u.Kelas;const eml=isOrtu?A.u.EmailAnak:A.u.Email;
  const[rt,rj,rm]=await Promise.all([api('getTugas',{kelas:kls}),api('getJawabanTugas',{email:eml}),api('getMapel',{kelas:kls})]);
  if(!rt.success)return empty('fa-triangle-exclamation',rt.message);
  A.d.jawaban=(rj.success?rj.data:[]).map(normJ);
  const mm={};if(rm.success)rm.data.forEach(m=>mm[m.IDMapel]=m.NamaMapel);
  let h=`<div><h1 class="font-h font-800 text-xl mb-4">Daftar Tugas</h1><div class="space-y-3">`;
  rt.data.forEach(t=>{
    const sub=A.d.jawaban.find(j=>j.IDTugas===t.IDTugas||j.idtugas===t.IDTugas);
    const isGraded=sub&&sub.Nilai!==''&&sub.Nilai!==null&&sub.Nilai!==undefined;
    const mNames=String(t.IDMapel).split(',').map(x=>mm[x.trim()]||x.trim()).join(', ');
    let badge=`<span class="bd-tag bg3">Belum Dikumpul</span>`;
    if(sub){badge=isGraded?`<span class="bd-tag bgg">Nilai: ${sub.Nilai||sub.nilai}</span>`:`<span class="bd-tag bgy">Menunggu Penilaian</span>`}
    h+=`<div class="cd"><div class="flex flex-col md:flex-row justify-between gap-3"><div class="flex-1"><div class="flex flex-wrap items-center gap-1.5 mb-1"><h3 class="font-h font-700 text-sm">${t.Judul}</h3>${badge}<span class="bd-tag bg1 text-xs">${mNames}</span><span class="bd-tag bg4 text-xs">${t.Tipe||'Individu'}</span></div><p class="text-[11px] text-gray-500"><i class="fas fa-calendar text-[10px]"></i> Tenggat: ${fmtDS(t.Tenggat)}</p>${sub&&(sub.LinkJawaban||sub.linkjawaban)?`<a href="${sub.LinkJawaban||sub.linkjawaban}" target="_blank" class="text-xs text-blue-600 mt-1 inline-block"><i class="fas fa-link"></i> Link Tugas Terkirim</a>`:''}</div><div class="flex-shrink-0">${!isOrtu?`<button class="bt ${sub?'bt2':'bt1'} bts" onclick="opST('${t.IDTugas}','${t.Tipe}','${kls}')"><i class="fas fa-${sub?'rotate-right':'upload'}"></i> ${sub?'Kirim Ulang':'Kumpulkan'}</button>`:''}</div></div></div>`;
  });
  return h+'</div></div>';
}

async function smT(id,tipe){

  const r=await api('submitTugas',{idTugas:id,emailPengumpul:A.u.Email,namaPengumpul:A.u.Nama,tipe,emailAnggota:_ms.map(s=>s.e).join(','),namaAnggota:_ms.map(s=>s.n).join(','),linkJawaban:l});
  if(r.success){clM();invCache(['getJawabanTugas']);toast('Tugas berhasil dikirim');nav(A.p)}else toast(r.message,'error');

  const email=A.u.Role==='Orang Tua'?A.u.EmailAnak:A.u.Email;
  const nama=A.u.Role==='Orang Tua'?A.u.NamaAnak:A.u.Nama;
  const kls=A.u.Role==='Orang Tua'?A.u.KelasAnak:A.u.Kelas;const nisn=A.u.NISN||'';
  return`<div><h1 class="font-h font-800 text-xl mb-4">Rapor dan Transkrip</h1>
  <div class="cd mb-3"><div class="flex items-center gap-3 mb-3"><div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background:var(--gl)"><i class="fas fa-graduation-cap" style="color:var(--g1)"></i></div><div><p class="font-h font-700">${nama}</p><p class="text-xs text-gray-500">Kelas ${kls} · NISN: ${nisn||'-'}</p></div></div>
  <div class="flex flex-wrap gap-2">
    <button class="bt bt1" onclick="cetakRaporAkademik('${email}','${esc(nama)}','${kls}','${nisn}')"><i class="fas fa-file-alt"></i> Rapor Akademik</button>
    <button class="bt bty" onclick="cetakRaporKarakter('${email}','${esc(nama)}','${nisn}','${kls}')"><i class="fas fa-seedling"></i> Rapor Karakter</button>
  </div></div></div>`;
}
async function pTK(){
  const rk=await api('getKelasList');
  return`<div><h1 class="font-h font-800 text-xl mb-4">Cetak Rapor Siswa</h1>
  <div class="cd mb-3"><div class="flex gap-3 items-end"><div class="flex-1"><label class="fl">Kelas</label><select id="tkK" class="fi">${so(rk.success?rk.data.map(k=>({v:k,l:k})):[])}</select></div><button class="bt bt1" onclick="ldTK()"><i class="fas fa-users"></i> Muat Siswa</button></div></div>
  <div id="tkC"></div></div>`;
}
async function ldTK(){
  const k=document.getElementById('tkK').value,c=document.getElementById('tkC');if(!k)return;c.innerHTML=skC();
  const rs=await api('getSiswaByKelas',{kelas:k});const siswa=rs.success?rs.data.filter(u=>u.Role==='Siswa'):[];
  let h=`<div class="cd"><table class="tb"><thead><tr><th>Nama Siswa</th><th>NISN</th><th>Rapor</th></tr></thead><tbody>`;
  siswa.forEach(s=>{h+=`<tr><td class="font-600">${s.Nama}</td><td class="text-xs">${s.NISN||'-'}</td><td><div class="flex gap-1"><button class="bt bt1 bts" onclick="cetakRaporAkademik('${s.Email}','${esc(s.Nama)}','${k}','${s.NISN||''}')"><i class="fas fa-file-alt"></i> Akademik</button><button class="bt bty bts" onclick="cetakRaporKarakter('${s.Email}','${esc(s.Nama)}','${s.NISN||''}','${k}')"><i class="fas fa-seedling"></i> Karakter</button></div></td></tr>`});
  c.innerHTML=h+'</tbody></table></div>';
}

async function getProfilDefault(){
  const r=await api('getProfilSekolah');if(r.success&&r.data.length>0)return normJ(r.data[0]);
  return{namasekolah:'PKBM Baitul Hikmah',alamat:'Jl. Pendidikan',kepalasekolah:'Kepala Sekolah',walikelas:'Wali Kelas'};
}

async function cetakRaporAkademik(email,nama,kelas,nisn){
  const[rT,rC,rM,profil]=await Promise.all([api('getTranskrip',{email,kelas}),api('getCapaian',{semester:A.sess.semester}),api('getMapel'),getProfilDefault()]);
  const transkrip=rT.success?rT.data:[];
  const capaianAll=rC.success?rC.data.map(normJ):[];
  const mapelList=rM.success?rM.data.map(normJ):[];
  const mapelIdToName={};mapelList.forEach(m=>mapelIdToName[m.idmapel||m.IDMapel]=(m.namamapel||m.NamaMapel||''));

  const{jsPDF}=window.jspdf;const doc=new jsPDF('p','mm','a4');
  const pw=210,ml=15,mr=15;let y=12;

  if(LOGO_B64)try{doc.addImage(LOGO_B64,'JPEG',ml,y,18,18)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(13);
  doc.text('PKBM BAITUL HIKMAH',pw/2,y+5,{align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text(profil.alamat||'',pw/2,y+11,{align:'center'});
  doc.setLineWidth(0.5);doc.line(ml,y+16,pw-mr,y+16);
  y+=22;

  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('LAPORAN HASIL BELAJAR (RAPOR AKADEMIK)',pw/2,y,{align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(`Semester ${A.sess.semester} — Tahun Pelajaran ${A.sess.tahunPelajaran}`,pw/2,y+6,{align:'center'});
  y+=14;

  doc.setFontSize(9);
  const col2=pw/2+5;
  doc.text('Nama Siswa',ml,y);doc.text(': '+nama,ml+28,y);
  doc.text('Kelas',col2,y);doc.text(': '+kelas,col2+20,y);y+=5;
  doc.text('NISN',ml,y);doc.text(': '+(nisn||'-'),ml+28,y);
  doc.text('Semester',col2,y);doc.text(': '+A.sess.semester,col2+20,y);y+=5;
  doc.text('Sekolah',ml,y);doc.text(': PKBM Baitul Hikmah',ml+28,y);
  doc.text('Tahun Ajaran',col2,y);doc.text(': '+A.sess.tahunPelajaran,col2+20,y);y+=8;

  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('A. NILAI DAN KETERCAPAIAN KOMPETENSI',ml,y);y+=4;

  let tb=[];let no=1;
  transkrip.forEach(t=>{
    if(String(t.namaMapel).toLowerCase().includes('project'))return;
    const targetMapelId=mapelList.find(m=>(m.namamapel||m.NamaMapel||'').toLowerCase().trim()===String(t.namaMapel).toLowerCase().trim())?.idmapel||null;
    let cap=capaianAll.find(c=>(String(c.idmapel)===String(targetMapelId)||String(c.matapelajaran||'').toLowerCase().trim()===String(t.namaMapel).toLowerCase().trim())&&(String(c.semester)===String(A.sess.semester)||String(c.semester)==='Semua'));
    const capText=cap?(cap.deskripsicapaian||cap.deskripsiCapaian||'Siswa menunjukkan kemajuan yang baik dalam mata pelajaran ini.'):'Siswa menunjukkan kemajuan yang baik dalam mata pelajaran ini.';
    tb.push([no++,t.namaMapel,t.nilaiAkhir,capText]);
  });

  doc.autoTable({startY:y,head:[['No','Mata Pelajaran','Nilai','Deskripsi Capaian Kompetensi']],body:tb,theme:'grid',styles:{fontSize:8,font:'helvetica'},headStyles:{fillColor:[29,78,216],textColor:255,fontStyle:'bold'},columnStyles:{0:{cellWidth:8},1:{cellWidth:32},2:{cellWidth:14},3:{cellWidth:116}},alternateRowStyles:{fillColor:[240,247,255]}});
  y=doc.lastAutoTable.finalY+12;

  if(y>245){doc.addPage();y=20}
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('Orang Tua/Wali Murid,',ml+5,y);doc.text('Wali Kelas,',pw-mr-55,y);
  y+=22;
  doc.text('______________________',ml+5,y);doc.text(profil.walikelas||'______________________',pw-mr-55,y);
  y+=12;if(y>270){doc.addPage();y=20}
  doc.text('Mengetahui,',pw/2,y,{align:'center'});
  doc.text('Kepala Sekolah PKBM Baitul Hikmah',pw/2,y+5,{align:'center'});
  doc.text(profil.kepalasekolah||'______________________',pw/2,y+22,{align:'center'});

  previewPdf(doc,'Rapor_Akademik_'+nama.replace(/\s+/g,'_')+'.pdf');
}

async function cetakRaporKarakter(email,nama,nisn,kelas){
  const[rt,rn,profil]=await Promise.all([api('getTargetKarakter',{semester:A.sess.semester,kelas}),api('getNilaiKarakter',{emailSiswa:email,semua:true,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran}),getProfilDefault()]);
  const tG=rt.success?(rt.dataGuru||[]).map(normJ):[];const tO=rt.success?(rt.dataOrtu||[]).map(normJ):[];
  const nilais=rn.success?rn.data.map(normJ):[];

  const{jsPDF}=window.jspdf;const doc=new jsPDF('p','mm','a4');
  const pw=210,ml=15,mr=15;let y=12;

  if(LOGO_B64)try{doc.addImage(LOGO_B64,'JPEG',ml,y,18,18)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('ATOMIC SCHOOL',pw/2,y+5,{align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(profil.alamat||'',pw/2,y+11,{align:'center'});
  doc.setLineWidth(0.5);doc.line(ml,y+16,pw-mr,y+16);y+=22;

  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('LAPORAN PENILAIAN KARAKTER SISWA',pw/2,y,{align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(`Semester ${A.sess.semester} — Tahun Pelajaran ${A.sess.tahunPelajaran}`,pw/2,y+6,{align:'center'});y+=14;

  doc.setFontSize(9);
  doc.text('Nama Siswa',ml,y);doc.text(': '+nama,ml+28,y);doc.text('Kelas',pw/2+5,y);doc.text(': '+kelas,pw/2+25,y);y+=5;
  doc.text('NISN',ml,y);doc.text(': '+(nisn||'-'),ml+28,y);doc.text('Semester',pw/2+5,y);doc.text(': '+A.sess.semester,pw/2+25,y);y+=8;

  const lblMap={1:'Perlu Bimbingan',2:'Mulai Berkembang',3:'Berkembang Sesuai Harapan',4:'Sangat Berkembang'};

  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('A. PENILAIAN KARAKTER OLEH GURU (Skala 1–4)',ml,y);y+=4;
  let tbG=[];tG.forEach((t,i)=>{const idT=t.id||t.idkarakter;const nObj=nilais.find(n=>String(n.idtarget)===String(idT)&&String(n.penilai).toLowerCase()==='guru');const v=nObj?nObj.nilai:'-';tbG.push([i+1,t.bidang||'-',t.target||'-',v,lblMap[v]||'-'])});
  doc.autoTable({startY:y,head:[['No','Bidang','Target/Indikator','Nilai','Keterangan']],body:tbG,theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[29,78,216],textColor:255,fontStyle:'bold'},columnStyles:{0:{cellWidth:8},1:{cellWidth:24},2:{cellWidth:80},3:{cellWidth:12},4:{cellWidth:46}}});
  y=doc.lastAutoTable.finalY+8;

  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('B. PENILAIAN KARAKTER OLEH ORANG TUA (Skala 1–4)',ml,y);y+=4;
  let tbO=[];tO.forEach((t,i)=>{const idT=t.id||t.idkarakter;const nObj=nilais.find(n=>String(n.idtarget)===String(idT)&&String(n.penilai).toLowerCase().includes('ortu'));const v=nObj?nObj.nilai:'-';tbO.push([i+1,t.bidang||'-',t.target||'-',v,lblMap[v]||'-'])});
  doc.autoTable({startY:y,head:[['No','Bidang','Target/Indikator','Nilai','Keterangan']],body:tbO,theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[245,158,11],textColor:255,fontStyle:'bold'},columnStyles:{0:{cellWidth:8},1:{cellWidth:24},2:{cellWidth:80},3:{cellWidth:12},4:{cellWidth:46}}});

  y=doc.lastAutoTable.finalY+12;if(y>245){doc.addPage();y=20}
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('Orang Tua/Wali Murid,',ml+5,y);doc.text('Wali Kelas,',pw-mr-55,y);
  y+=22;doc.text('______________________',ml+5,y);doc.text(profil.walikelas||'______________________',pw-mr-55,y);
  y+=12;if(y>270){doc.addPage();y=20}
  doc.text('Mengetahui,',pw/2,y,{align:'center'});
  doc.text('Kepala Sekolah Atomic School',pw/2,y+5,{align:'center'});
  doc.text(profil.kepalasekolah||'______________________',pw/2,y+22,{align:'center'});

  previewPdf(doc,'Rapor_Karakter_'+nama.replace(/\s+/g,'_')+'.pdf');
}
