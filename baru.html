/* ============ HELPERS DASAR ============ */
function normJ(j){if(!j||typeof j!=='object')return j;const o={};for(const k of Object.keys(j)){const lk=k.toLowerCase().replace(/[\s_\-]+/g,'');o[lk]=j[k]}return o}
function fmtDS(iso){if(!iso)return'-';let s=String(iso);if(s.includes('T'))s=s.split('T')[0];let p=s.split('-');if(p.length===3){const bl=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return parseInt(p[2])+' '+bl[parseInt(p[1])-1]+' '+p[0]}return iso}
function fmtTime(v){if(!v)return'-';let s=String(v);if(s.includes('T')){let tp=s.split('T')[1];if(tp)return tp.substring(0,5)}if(s.includes(':'))return s.substring(0,5);if(typeof v==='number'){const h=Math.floor(v*24);const m=Math.round((v*24-h)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}return '-'}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function drP(u){if(!u)return '';if(u.includes('drive.google.com')){let m=u.match(/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;return u.replace(/\/view(\?|$)/,'/preview$1').replace(/\/edit(\?|$)/,'/preview$1')}return u}
function imgUrl(u){if(!u)return '';let m=u.match(/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m)return`https://lh3.googleusercontent.com/d/${m[1]}`;return u}
function getYtEmbedUrl(url){if(!url)return'';let regExp=/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;let match=url.match(regExp);if(match&&match[2].length===11)return'https://www.youtube.com/embed/'+match[2];return url}
function so(a,s='',p='-- Pilih --'){return`<option value="">${p}</option>`+a.map(o=>{const v=typeof o==='string'?o:o.v,l=typeof o==='string'?o:o.l;return`<option value="${v}"${v==s?' selected':''}>${l}</option>`}).join('')}
function fRp(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(Number(v)||0)}
function invCache(actions){for(const k in _c){for(const a of actions){if(k.includes('"'+a+'"')){delete _c[k];break}}}}

/* ============ PAGINATION HELPERS ============ */
function makePager(page, totalPages, total, perPage, fnName){
  const from = total === 0 ? 0 : (page - 1) * perPage + 1;
  const to   = Math.min(total, page * perPage);
  return `<div class="pager-bar">
    <span>Menampilkan ${from}–${to} dari ${total} data</span>
    <div class="flex items-center gap-1.5">
      <button class="ibtn" ${page<=1?'disabled':''} onclick="${fnName}(${page-1})"><i class="fas fa-chevron-left"></i></button>
      <span class="px-2 font-600">${page} / ${totalPages}</span>
      <button class="ibtn" ${page>=totalPages?'disabled':''} onclick="${fnName}(${page+1})"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>`;
}
function makePerPageSelect(id, current, onchange){
  return `<select id="${id}" class="fi fi-sm" style="width:auto" onchange="${onchange}">
    ${[5,10,25,50].map(n=>`<option value="${n}"${n===current?' selected':''}>${n} / hal</option>`).join('')}
  </select>`;
}
const PGR = {};
function initPager(view, data, per=10){ PGR[view] = { page: 1, per, data: data || [] }; }
function setPagerPer(view, per){ if(!PGR[view]) return; PGR[view].per = parseInt(per); PGR[view].page = 1; }
function gotoPager(view, p, renderFn){
  const s = PGR[view]; if(!s) return;
  const total = Math.max(1, Math.ceil(s.data.length / s.per));
  if(p < 1 || p > total) return;
  s.page = p; renderFn();
}
function pagerInfo(view){
  const s = PGR[view] || {page:1, per:10, data:[]};
  const total = s.data.length;
  const totalPages = Math.max(1, Math.ceil(total / s.per));
  if(s.page > totalPages) s.page = totalPages;
  const start = (s.page - 1) * s.per;
  return { items: s.data.slice(start, start + s.per), page: s.page, per: s.per, total, totalPages };
}
function pagerHtml(view, gotoFnName){
  const { page, totalPages, total, per } = pagerInfo(view);
  return makePager(page, totalPages, total, per, gotoFnName);
}
function pagerTopBar(view, onchangeFn){
  const s = PGR[view] || {per:10};
  return `<div class="flex justify-end mb-2">${makePerPageSelect('pg_'+view, s.per, onchangeFn)}</div>`;
}

function createMultiSelect(containerId, options, selectedVals=[], placeholder='Pilih...'){
  const cont = document.getElementById(containerId); if(!cont)return;
  let sel = [...selectedVals];
  window[containerId+'_opts']=options;

  function render(){
    cont.innerHTML=`<div class="relative w-full">
      <div class="ms-wrap" id="${containerId}_wrap" onclick="toggleMsDD('${containerId}')">
        ${sel.length===0?`<span class="text-xs text-slate-400 py-1">${placeholder}</span>`:''}
        ${sel.map(v=>{const o=options.find(x=>x.v==v);return o?`<span class="ms-pill">${o.l}<span class="rm" onclick="event.stopPropagation();msRemove('${containerId}','${v}')"><i class="fas fa-times"></i></span></span>`:''}).join('')}

      </div>
    </div>`;
  }
  window.toggleMsDD = function(cid){ const dd=document.getElementById(cid+'_dd'); if(dd) dd.classList.toggle('on'); };
  window.msToggle=function(cid,v,l){ const idx=sel.indexOf(String(v)); if(idx>-1)sel.splice(idx,1);else sel.push(String(v)); render(); document.getElementById(cid+'_dd')?.classList.add('on'); };
  window.msRemove=function(cid,v){ const idx=sel.indexOf(String(v)); if(idx>-1)sel.splice(idx,1); render(); document.getElementById(cid+'_dd')?.classList.add('on'); };
  render();
}

let _pendingCount=0;
async function api(a,d={}){
  d.action=a; const k=JSON.stringify({a,d}); const isMut=_sk.includes(a);
  if(!isMut&&_c[k])return _c[k];
  _pendingCount++;
  const gl=document.getElementById('glLoader'); gl.classList.add('on');
  document.getElementById('glLoaderText').textContent=d.fileData?'Mengunggah file...':'Memproses...';
  try{
    const r=await fetch(SU,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});
    const text = await r.text();
    let j;
    try { j = JSON.parse(text); } catch(err) {
      _pendingCount--; if(_pendingCount<=0){_pendingCount=0;gl.classList.remove('on')}
      return { success: false, message: 'Respon server bukan JSON valid: ' + text.substring(0, 100) };
    }
    if(!isMut)_c[k]=j;
    _pendingCount--; if(_pendingCount<=0){_pendingCount=0;gl.classList.remove('on')}
    return j;
  }catch(e){_pendingCount--;if(_pendingCount<=0){_pendingCount=0;gl.classList.remove('on')};return{success:false,message:'Koneksi gagal: '+e.message}}
}

function renderKsTable(){
  let data = [...PGR.ks.data];
  if(A.u.Role==='Guru') data = data.filter(u => u.Role==='Siswa' || u.Role==='Orang Tua');
  
  // Jangan overwrite PGR.ks.data
  const per = PGR.ks.per;
  const total = data.length;
  const totalPages = Math.max(1, Math.ceil(total / per));
  if(PGR.ks.page > totalPages) PGR.ks.page = totalPages;
  const start = (PGR.ks.page - 1) * per;
  const items = data.slice(start, start + per);
  
  const tb = document.getElementById('ksTb'), pg = document.getElementById('ksPager');
  if(!total){ tb.innerHTML = empty('fa-users','Tidak ada pengguna'); pg.innerHTML = ''; return; }
  
  let h = `<table class="tb w-full"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Kelas</th><th>Aksi</th></tr></thead><tbody>`;
  items.forEach(s=>{
    h += `<tr><td class="font-600 text-sm">${s.Nama}</td><td class="text-xs text-gray-500">${s.Email}</td><td><span class="bd-tag bg2">${s.Role}</span></td><td><span class="bd-tag bg4">${s.Kelas||'-'}</span></td><td><div class="flex gap-1"><button class="ibtn" onclick="mES('${s.ID}','${esc(s.Nama)}','${esc(s.Email)}','${esc(s.Role)}','${esc(s.Kelas)}','${esc(s.EmailAnak||'')}','${esc(s.NISN||'')}','${esc(s.NamaOrtu||'')}')"><i class="fas fa-pen"></i></button><button class="ibtn del" onclick="cfDel('Hapus ${esc(s.Nama)}?',async()=>{const r=await api('deleteSiswa',{id:'${s.ID}'});if(r.success){invCache(['getSiswaByKelas']);toast(r.message);nav('kelola-siswa')}else toast(r.message,'error')})"><i class="fas fa-trash"></i></button></div></td></tr>`;
  });
  h += '</tbody></table>';
  tb.innerHTML = h;
  pg.innerHTML = makePager(PGR.ks.page, totalPages, total, per, 'gpKs');
}

// ============ GANTI dlJgPdf() ============
async function dlJgPdf(){
  const d = A._jgData;
  if(!d.length){ toast('Tidak ada data','warning'); return; }
  
  // Ambil data mapel untuk mapping nama
  const rm = await api('getMapel');
  const mapelMap = {};
  if(rm.success){
    rm.data.forEach(m => {
      mapelMap[m.IDMapel || m.idmapel || m.id] = m.NamaMapel || m.namamapel;
    });
  }
  
  // Ambil data absensi untuk rekap kehadiran
  const ra = await api('getRiwayatAbsen', {});
  const absensiData = ra.success ? ra.data.map(normJ) : [];
  
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('l','mm','a4'); // Landscape untuk kolom lebih banyak
  const pw = 297, ml = 15, mr = 15;
  let y = 15;
  
  // Header
  if(LOGO_B64) try{ doc.addImage(LOGO_B64,'JPEG',ml,y,15,15) }catch(e){}
  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.text('JURNAL GURU', pw/2, y+5, {align:'center'});
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.text(`Semester ${A.sess.semester} — Tahun Pelajaran ${A.sess.tahunPelajaran}`, pw/2, y+11, {align:'center'});
  y += 20;
  
  // Table dengan nama mapel dan rekap kehadiran
  const tableData = d.map((j, i) => {
    const rawMapel = String(j.IDMapel || j.idmapel || '-');
    const mIds = rawMapel.split(',').map(x => x.trim());
    const mapelNames = mIds.map(id => mapelMap[id] || id).join(', ');
    
    // Hitung rekap kehadiran untuk kelas dan tanggal yang sama
    const tgl = String(j.Tanggal || j.tanggal || '').split('T')[0];
    const kelas = j.Kelas || j.kelas || '';
    const absensiHariItu = absensiData.filter(a => 
      String(a.tanggal).startsWith(tgl) && String(a.kelas) === String(kelas)
    );
    
    let hadir = 0, sakit = 0, izin = 0, alpha = 0;
    absensiHariItu.forEach(a => {
      if(a.status === 'Hadir') hadir++;
      else if(a.status === 'Sakit') sakit++;
      else if(a.status === 'Izin') izin++;
      else alpha++;
    });
    
    return [
      i + 1,
      mapelNames,
      fmtDS(j.Tanggal || j.tanggal),
      kelas,
      j.MateriYangDiajarkan || j.materiyangdiajarkan || '-',
      j.StatusGuru || j.statusguru || 'Hadir',
      `H:${hadir} S:${sakit} I:${izin} A:${alpha}`
    ];
  });
  
  doc.autoTable({
    startY: y,
    head: [['No', 'Mata Pelajaran', 'Tanggal', 'Kelas', 'Materi', 'Status', 'Kehadiran Siswa']],
    body: tableData,
    theme: 'grid',
    styles: { fontSize: 8 },
    headStyles: { fillColor: [29,78,216], textColor: 255, fontStyle: 'bold' },
    columnStyles: {
      0: { cellWidth: 10 },
      1: { cellWidth: 50 },
      2: { cellWidth: 25 },
      3: { cellWidth: 20 },
      4: { cellWidth: 70 },
      5: { cellWidth: 20 },
      6: { cellWidth: 50 }
    }
  });
  
  previewPdf(doc, 'Jurnal_Guru.pdf');
}

async function ldKgFormVals(){
  const email = document.getElementById('kgS').value;
  const type = document.getElementById('kgType').value;
  const kelas = document.getElementById('kgK').value;
  const bulan = type === 'Ortu' ? document.getElementById('kgB')?.value : '';
  const filterBidang = document.getElementById('kgFBidang')?.value || '';
  
  const area = document.getElementById('kgFormArea');
  area.innerHTML = sk(10);
  
  const [rt, rn] = await Promise.all([
    api('getTargetKarakter', {semester: A.sess.semester, kelas, bulan}),
    api('getNilaiKarakter', {emailSiswa: email, semua: true, semester: A.sess.semester, tahunPelajaran: A.sess.tahunPelajaran, bulan})
  ]);
  
  let targets = type === 'Guru' ? (rt.success ? rt.dataGuru.map(normJ) : []) : (rt.success ? rt.dataOrtu.map(normJ) : []);
  const nilais = rn.success ? rn.data.map(normJ) : [];
  
  // Update filter bidang options
  const allBidang = [...new Set(targets.map(t => t.bidang || 'Umum').filter(Boolean))];
  const fbSelect = document.getElementById('kgFBidang');
  if(fbSelect && fbSelect.options.length <= 1){
    fbSelect.innerHTML = '<option value="">Semua Bidang</option>' + allBidang.map(b => `<option value="${b}">${b}</option>`).join('');
  }
  
  // Apply filter bidang
  if(filterBidang){
    targets = targets.filter(t => (t.bidang || 'Umum') === filterBidang);
  }
  
  let h = `<div class="cd"><h3 class="font-h font-700 text-sm mb-3">Penilaian Karakter — ${type === 'Guru' ? 'Oleh Guru' : 'Oleh Orang Tua'}</h3>`;
  
  if(!targets.length){
    h += `<div class="warn-box"><i class="fas fa-info-circle text-yellow-600"></i><p>Belum ada target karakter untuk ${type === 'Guru' ? 'Guru' : 'Orang Tua'}.</p></div>`;
  } else {
    h += `<div class="space-y-4">`;
    const byBidang = {};
    targets.forEach(t => {
      const b = t.bidang || 'Umum';
      if(!byBidang[b]) byBidang[b] = [];
      byBidang[b].push(t);
    });
    
    for(const [bidang, items] of Object.entries(byBidang)){
      h += `<div><p class="text-xs font-700 text-blue-700 mb-2 uppercase tracking-wide">${bidang}</p>`;
      items.forEach(t => {
        const idT = t.id || t.idkarakter;
        const v = nilais.find(n => String(n.idtarget) === String(idT) && String(n.penilai).toLowerCase() === type.toLowerCase())?.nilai;
        h += `<div class="p-3 border rounded-lg mb-2">
          <p class="text-sm mb-2">${t.target}</p>
          <div class="flex gap-2 flex-wrap">`;
        [1,2,3,4].forEach(n => {
          h += `<label class="text-center cursor-pointer">
            <div class="kar-score${v==n?' sel':''}" onclick="selKar(this,'kar_${idT}',${n})">${n}</div>
            <input type="radio" name="kar_${idT}" value="${n}" ${v==n?'checked':''} style="display:none">
            <div class="kar-desc">${['PB','MB','BSH','SB'][n-1]}</div>
          </label>`;
        });
        h += `</div></div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  }
  h += `<button class="bt bt1 mt-3 w-full justify-center" onclick="svKg()"><i class="fas fa-save"></i> Simpan Penilaian</button></div>`;
  area.innerHTML = h;
}

function selKar(el, name, val){
  const wrap = el.closest('.flex') || el.parentElement?.parentElement;
  if(wrap) wrap.querySelectorAll('.kar-score').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  const inp = document.querySelector(`input[name="${name}"][value="${val}"]`);
  if(inp) inp.checked = true;
}

let _mtState = { mapelList:[], materiByMapel:{} };
async function pMt(){
  const [rm, rp] = await Promise.all([api('getMapel'), api('getProgress',{email:A.u.Email})]);
  if(!rm.success) return empty('fa-exclamation','Gagal memuat mapel');
  const allMapel = rm.data.map(normJ);
  const studentKelas = A.u.Kelas || '';
  const mapelList = allMapel.filter(mp => !mp.kelas || mp.kelas === 'Semua' || mp.kelas === studentKelas);
  A.d.progress = rp.success ? rp.data.map(normJ) : [];
  const mR = await Promise.all(mapelList.map(mp => api('getMateriByMapel',{idMapel: mp.idmapel || mp.IDMapel || mp.id})));
  _mtState.mapelList = mapelList;
  _mtState.materiByMapel = {};
  let totalMateri = 0;
  mapelList.forEach((mp, i)=>{
    const items = (mR[i].success ? mR[i].data : []).map(normJ);
    _mtState.materiByMapel[mp.idmapel || mp.IDMapel || mp.id] = items;
    totalMateri += items.length;
  });
  if(!totalMateri) return `<div><h1 class="font-h font-800 text-xl mb-4">Materi Pelajaran</h1>${empty('fa-book-open','Belum ada materi pelajaran untuk kelas Anda.')}</div>`;
  initPager('mt', mapelList, 3);
  setTimeout(renderMt, 30);
  return `<div>
    <div class="flex justify-between items-center mb-4">
      <div><h1 class="font-h font-800 text-xl">Materi Pelajaran</h1></div>
      ${makePerPageSelect('pg_mt', PGR.mt.per, `setPagerPer('mt', this.value); renderMt()`)}
    </div>
    <div id="mtC"></div>
  </div>`;
}
function renderMt(){
  const { items } = pagerInfo('mt');
  const c = document.getElementById('mtC');
  let h = '';
  items.forEach(mp=>{
    const mapelId = mp.idmapel || mp.IDMapel || mp.id;
    const matItems = _mtState.materiByMapel[mapelId] || [];
    if(!matItems.length) return;
    const mapelName = mp.namamapel || mp.NamaMapel || 'Mapel';
    const babs = {};
    matItems.forEach(m=>{ const bab = m.bab || 'Materi Umum'; if(!babs[bab]) babs[bab] = []; babs[bab].push(m); });
    h += `<div class="cd mb-4"><h2 class="font-h font-700 text-base mb-3 text-blue-800 border-b pb-2"><i class="fas fa-layer-group mr-2"></i>${mapelName}</h2>`;
    for(const [bab, matList] of Object.entries(babs)){
      h += `<div class="mb-3"><h3 class="font-600 text-sm mb-2 text-slate-700"><i class="fas fa-bookmark mr-1.5 text-blue-600"></i>${bab}</h3><div class="space-y-2">`;
      matList.forEach(m=>{
        const mid = m.idmateri || m.id || '';
        const judul = m.judul || m.Judul || 'Materi';
        const pdfUrl = m.pdfurl || m.PdfUrl || '';
        const ytUrl = m.youtubeurl || m.YoutubeUrl || '';
        const done = A.d.progress.find(p => String(p.idmateri||p.IDMateri)===String(mid) && p.status==='Selesai');
        h += `<div class="rounded-xl p-3 border bg-white flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
          <div class="flex-1"><p class="font-600 text-sm">${judul}</p>${m.deskripsi?`<p class="text-xs text-slate-500 mt-0.5">${m.deskripsi}</p>`:''}</div>
          <div class="flex items-center gap-1.5 flex-wrap">
            ${pdfUrl?`<button class="bt bt2 bts" onclick="opV('${esc(judul)}','${drP(pdfUrl)}')"><i class="fas fa-file-pdf text-red-600"></i> PDF</button>`:''}
            ${ytUrl?`<button class="bt bty bts" onclick="opYT('${esc(judul)}','${ytUrl}')"><i class="fab fa-youtube text-white"></i> YouTube</button>`:''}
            <button class="bt ${done?'bt1':'bt2'} bts" onclick="mDn('${mid}',this)" ${done?'disabled':''}>${done?'<i class="fas fa-check"></i> Selesai':'Tandai Selesai'}</button>
          </div></div>`;
      });
      h += `</div></div>`;
    }
    h += `</div>`;
  });
  h += pagerHtml('mt','gpMt');
  c.innerHTML = h;

let _jgAnakData = [], _jgAnakPage = 1, _jgAnakPer = 10;
async function pJgAnak(){
  const [rj, rm] = await Promise.all([api('getJurnal', {kelas: A.u.KelasAnak}), api('getMapel')]);
  _jgAnakData = rj.success ? rj.data : [];
  A.d.mapel = rm.success ? rm.data.map(normJ) : [];
  _jgAnakPage = 1;
  setTimeout(renderJgAnak, 30);
  return `<div>
    <div class="flex justify-between items-center mb-4">
      <div>
        <h1 class="font-h font-800 text-xl">Jurnal Kelas ${A.u.KelasAnak}</h1>
        <p class="text-xs mt-0.5" style="color:var(--tx3)">Filter berdasarkan tanggal & lihat nama mata pelajaran</p>
      </div>
      ${makePerPageSelect('jgaPer', _jgAnakPer, '_jgAnakPage=1;_jgAnakPer=parseInt(this.value);renderJgAnak()')}
    </div>
    <div class="cd mb-3">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div><label class="fl">Dari Tanggal</label><input type="date" id="jgaDari" class="fi" onchange="_jgAnakPage=1;renderJgAnak()"></div>
        <div><label class="fl">Sampai Tanggal</label><input type="date" id="jgaSampai" class="fi" onchange="_jgAnakPage=1;renderJgAnak()"></div>
        <div class="flex items-end">
          <button class="bt bt2 w-full justify-center" onclick="document.getElementById('jgaDari').value='';document.getElementById('jgaSampai').value='';_jgAnakPage=1;renderJgAnak()"><i class="fas fa-rotate-left"></i> Reset Filter</button>
        </div>
      </div>
    </div>
    <div id="jgAnakC"></div>
  </div>`;
}
function renderJgAnak(){
  const dari = document.getElementById('jgaDari')?.value || '';
  const sampai = document.getElementById('jgaSampai')?.value || '';
  const mm = {}; (A.d.mapel||[]).forEach(m=>{ mm[m.IDMapel||m.idmapel||m.id] = m.NamaMapel||m.namamapel||m.namaMapel; });
  let data = [..._jgAnakData];
  if(dari)   data = data.filter(j => String(j.Tanggal||j.tanggal||'') >= dari);
  if(sampai) data = data.filter(j => String(j.Tanggal||j.tanggal||'') <= sampai);
  data.sort((a,b)=> String(b.Tanggal||b.tanggal||'').localeCompare(String(a.Tanggal||a.tanggal||'')));
  const total = data.length;
  const totalPages = Math.max(1, Math.ceil(total / _jgAnakPer));
  if(_jgAnakPage > totalPages) _jgAnakPage = totalPages;
  const start = (_jgAnakPage - 1) * _jgAnakPer;
  const pageItems = data.slice(start, start + _jgAnakPer);
  const c = document.getElementById('jgAnakC');
  if(!pageItems.length){ c.innerHTML = empty('fa-book','Belum ada jurnal untuk filter ini'); return; }
  let h = '<div class="space-y-2">';
  pageItems.forEach(j=>{
    const rawMapel = String(j.IDMapel || j.idmapel || '-');
    const mNames = rawMapel.split(',').map(x => mm[x.trim()] || x.trim()).join(', ');
    const tgl = fmtDS(j.Tanggal || j.tanggal); const tglP = tgl.split(' ');
    const status = j.StatusGuru || j.statusguru || 'Hadir';
    h += `<div class="jurnal-card">
      <div class="jurnal-date-badge"><div class="text-lg font-800 leading-none">${tglP[0]||'-'}</div><div class="text-[10px] leading-none mt-0.5">${(tglP[1]||'').substring(0,3)}</div><div class="text-[10px]">${tglP[2]||''}</div></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap mb-1"><span class="bd-tag bg2 text-xs">${mNames}</span><span class="bd-tag ${status==='Hadir'?'bgg':status==='Sakit'?'bgy':'bg3'} text-xs">${status}</span></div>
        <p class="text-sm font-600">${j.MateriYangDiajarkan || j.materiyangdiajarkan || '-'}</p>
        <p class="text-[11px] mt-0.5" style="color:var(--tx3)"><i class="fas fa-user-tie text-[10px]"></i> ${j.NamaGuru||j.namaguru||'-'} · <i class="fas fa-clock text-[10px]"></i> ${fmtTime(j.WaktuMulai||j.waktumulai)} — ${fmtTime(j.WaktuSelesai||j.waktuselesai)}</p>
      </div>
    </div>`;
  });
  h += '</div>';
  h += makePager(_jgAnakPage, totalPages, total, _jgAnakPer, 'gotoJgAnakPage');
  c.innerHTML = h;
}
function gotoJgAnakPage(p){
  const totalPages = Math.max(1, Math.ceil((_jgAnakData?.length||0) / _jgAnakPer));
  if(p < 1 || p > totalPages) return;
  _jgAnakPage = p; renderJgAnak();
}

// ============ GANTI cetakRaporAkademik() ============
async function cetakRaporAkademik(email, nama, kelas, nisn){
  const [rT, rC, rM, profil, rSiswa, rPrestasi, rAbsen] = await Promise.all([
    api('getTranskrip', {email, kelas}),
    api('getCapaian', {semester: A.sess.semester}),
    api('getMapel'),
    getProfilDefault(),
    api('getSiswaByKelas', {kelas: '__ALL__'}),
    api('getPrestasi'),
    api('getRiwayatAbsen', {kelas})
  ]);
  
  const transkrip = rT.success ? rT.data : [];
  const capaianAll = rC.success ? rC.data.map(normJ) : [];
  const mapelList = rM.success ? rM.data.map(normJ) : [];
  
  // Cari data siswa untuk nama orang tua
  const siswaData = rSiswa.success ? rSiswa.data.find(s => String(s.Email).toLowerCase() === String(email).toLowerCase()) : null;
  const namaOrtu = siswaData?.NamaOrtu || siswaData?.namaortu || '-';
  
  // Prestasi siswa
  const prestasiAll = rPrestasi.success ? rPrestasi.data.map(normJ) : [];
  const prestasiSiswa = prestasiAll.filter(p => String(p.emailsiswa||'').toLowerCase() === String(email).toLowerCase());
  
  // Absensi siswa (hitung Sakit, Izin, Alpha)
  const absenAll = rAbsen.success ? rAbsen.data.map(normJ) : [];
  const absenSiswa = absenAll.filter(a => String(a.emailsiswa||'').toLowerCase() === String(email).toLowerCase());
  let cntSakit = 0, cntIzin = 0, cntAlpha = 0;
  absenSiswa.forEach(a => {
    const st = String(a.status || '').toLowerCase();
    if(st === 'sakit') cntSakit++;
    else if(st === 'izin') cntIzin++;
    else if(st === 'alpha' || st === 'tanpa keterangan') cntAlpha++;
  });
  
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  const pw = 210, ml = 15, mr = 15;
  let y = 15;
  
  // ============ HEADER ============
  if(LOGO_B64) try{ doc.addImage(LOGO_B64,'JPEG',ml,y,20,20) }catch(e){}
  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.text('LAPORAN HASIL BELAJAR', pw/2, y+8, {align:'center'});
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.text(`Semester ${A.sess.semester} — Tahun Pelajaran ${A.sess.tahunPelajaran}`, pw/2, y+14, {align:'center'});
  doc.setLineWidth(0.5);
  doc.line(ml, y+22, pw-mr, y+22);
  y += 28;
  
  // ============ INFO SISWA ============
  doc.setFontSize(10);
  const col2 = pw/2 + 5;
  const lineH = 6;
  
  doc.text('Nama', ml, y); doc.text(': ' + nama, ml+35, y);
  doc.text('Kelas', col2, y); doc.text(': ' + kelas, col2+35, y);
  y += lineH;
  doc.text('NISN', ml, y); doc.text(': ' + (nisn || '-'), ml+35, y);
  doc.text('Semester', col2, y); doc.text(': ' + A.sess.semester, col2+35, y);
  y += lineH;
  doc.text('Sekolah', ml, y); doc.text(': ' + (profil.namasekolah || 'PKBM Baitul Hikmah'), ml+35, y);
  doc.text('Tahun Pelajaran', col2, y); doc.text(': ' + A.sess.tahunPelajaran, col2+35, y);
  y += lineH;
  doc.text('Alamat', ml, y); doc.text(': ' + (profil.alamat || '-'), ml+35, y);
  y += 8;
  
  // ============ A. NILAI AKADEMIK ============
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('A. Nilai Akademik', ml, y);
  y += 2;
  
  let tbA = [];
  let no = 1;
  transkrip.forEach(t => {
    if(String(t.namaMapel).toLowerCase().includes('project')) return;
    const targetMapelId = mapelList.find(m => 
      (m.namamapel || m.NamaMapel || '').toLowerCase().trim() === String(t.namaMapel).toLowerCase().trim()
    )?.idmapel || null;
    let cap = capaianAll.find(c => 
      (String(c.idmapel) === String(targetMapelId) || 
       String(c.matapelajaran || '').toLowerCase().trim() === String(t.namaMapel).toLowerCase().trim()) && 
      (String(c.semester) === String(A.sess.semester) || String(c.semester) === 'Semua')
    );
    const capText = cap ? (cap.deskripsicapaian || cap.deskripsiCapaian || '-') : 'Siswa menunjukkan kemajuan yang baik dalam mata pelajaran ini.';
    tbA.push([no++, t.namaMapel, t.nilaiAkhir, capText]);
  });
  
  doc.autoTable({
    startY: y,
    head: [['No', 'Mata Pelajaran', 'Nilai', 'Deskripsi Capaian Kompetensi']],
    body: tbA.length ? tbA : [['-', 'Belum ada nilai', '-', '-']],
    theme: 'grid',
    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
    headStyles: { fillColor: [29,78,216], textColor: 255, fontStyle: 'bold' },
    columnStyles: {
      0: { cellWidth: 8, halign: 'center' },
      1: { cellWidth: 40 },
      2: { cellWidth: 15, halign: 'center', fontStyle: 'bold' },
      3: { cellWidth: 117 }
    },
    margin: { left: ml, right: mr }
  });
  y = doc.lastAutoTable.finalY + 10;
  
  // ============ B. PRESTASI ============
  if(y > 230){ doc.addPage(); y = 20; }
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('B. Prestasi', ml, y);
  y += 2;
  
  let tbB = [];
  if(prestasiSiswa.length){
    prestasiSiswa.forEach((p, i) => {
      tbB.push([i+1, p.namaprestasi || '-', p.juara || '-', p.tahun || '-']);
    });
  } else {
    tbB.push(['-', 'Belum ada prestasi tercatat', '-', '-']);
  }
  
  doc.autoTable({
    startY: y,
    head: [['No', 'Prestasi', 'Juara', 'Tahun']],
    body: tbB,
    theme: 'grid',
    styles: { fontSize: 8, cellPadding: 2 },
    headStyles: { fillColor: [29,78,216], textColor: 255, fontStyle: 'bold' },
    columnStyles: {
      0: { cellWidth: 10, halign: 'center' },
      1: { cellWidth: 110 },
      2: { cellWidth: 30, halign: 'center' },
      3: { cellWidth: 30, halign: 'center' }
    },
    margin: { left: ml, right: mr }
  });
  y = doc.lastAutoTable.finalY + 10;
  
  // ============ C. KETIDAKHADIRAN ============
  if(y > 230){ doc.addPage(); y = 20; }
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('C. Ketidakhadiran', ml, y);
  y += 2;
  
  doc.autoTable({
    startY: y,
    head: [['Keterangan', 'Jumlah']],
    body: [
      ['Sakit', cntSakit + ' Hari'],
      ['Izin', cntIzin + ' Hari'],
      ['Tanpa Keterangan', cntAlpha + ' Hari']
    ],
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 2 },
    headStyles: { fillColor: [29,78,216], textColor: 255, fontStyle: 'bold' },
    columnStyles: {
      0: { cellWidth: 100 },
      1: { cellWidth: 80, halign: 'center', fontStyle: 'bold' }
    },
    margin: { left: ml, right: mr }
  });
  y = doc.lastAutoTable.finalY + 15;
  
  // ============ TANDA TANGAN ============
  if(y > 240){ doc.addPage(); y = 20; }
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  
  doc.text('Orang Tua/Wali Murid,', ml+5, y);
  doc.text('Wali Kelas,', pw-mr-55, y);
  
  y += 6;
  doc.text(namaOrtu || '......................', ml+5, y+18);
  doc.text(profil.walikelas || '......................', pw-mr-55, y+18);
  
  y += 28;
  if(y > 260){ doc.addPage(); y = 20; }
  doc.text('Mengetahui,', pw/2, y, {align:'center'});
  doc.text('Kepala Sekolah ' + (profil.namasekolah || ''), pw/2, y+6, {align:'center'});
  y += 24;
  doc.setFont('helvetica','bold');
  doc.text(profil.kepalasekolah || '......................', pw/2, y, {align:'center'});
  
  previewPdf(doc, 'Rapor_Akademik_' + nama.replace(/\s+/g,'_') + '.pdf');
}
