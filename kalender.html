<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto PDF Kalender Kegiatan Musyawarah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js untuk membaca file PDF langsung di browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="bg-white shadow-sm rounded-2xl p-6 mb-6 border border-slate-100">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Kalender Daerah</h1>
            <p class="text-slate-600 text-sm">Hasil musda.</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white shadow-sm rounded-2xl p-6 mb-6 border border-slate-100">
            <label class="block text-sm font-semibold text-slate-700 mb-2">1. Upload File PDF Hasil Musyawarah:</label>
            
            <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer relative bg-slate-50">
                <input type="file" id="pdfFile" accept=".pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="handleFileUpload(event)">
                <div class="space-y-2">
                    <div class="text-3xl">📄</div>
                    <div class="text-sm font-medium text-slate-700" id="fileLabel">Klik di sini atau seret file PDF ke sini</div>
                    <p class="text-xs text-slate-400">Format yang didukung: .pdf</p>
                </div>
            </div>

            <textarea id="pdfInput" class="hidden"></textarea>

            <div class="mt-4 flex gap-3">
                <button onclick="parseText()" id="generateBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl transition text-sm shadow-sm">
                    ✨ Generate Kalender dari PDF
                </button>
                <button onclick="clearAll()" class="bg-red-50 hover:bg-red-100 text-red-600 font-medium px-4 py-2.5 rounded-xl transition text-sm ml-auto">
                    Reset Data
                </button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="bg-white shadow-sm rounded-2xl p-6 border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">🗓️Hasil Musyawarah</h2>
                <button id="copyAllBtn" onclick="copyAllSchedule()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-xl transition text-sm shadow-sm items-center gap-1.5">
                    📋 Salin Semua Hasil
                </button>
            </div>
            
            <div id="calendarOutput" class="space-y-4">
                <p class="text-slate-400 text-sm italic text-center py-8">Belum ada file PDF yang diunggah.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Parser & Formatter Logic -->
    <script>
        // Cek data tersimpan (Local Storage) saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const savedText = localStorage.getItem('savedPdfData');
            if (savedText) {
                document.getElementById('pdfInput').value = savedText;
                document.getElementById('fileLabel').innerText = "✅ Data tersimpan dari sesi sebelumnya";
                document.getElementById('generateBtn').classList.remove('hidden');
                parseText(); 
            }
        });

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileLabel').innerText = `File memproses: ${file.name}...`;
            
            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = '';

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        let lastY = -1;
                        let lastX = -1;
                        let textLine = '';
                        
                        // Sistem Scanner Baru: Menganalisa jarak antar huruf & baris
                        textContent.items.forEach(item => {
                            let currentY = item.transform[5];
                            let currentX = item.transform[4];
                            let fontSize = Math.abs(item.transform[0]) || 12;

                            // Jika ganti baris (jarak Y lebih besar dari 40% ukuran huruf)
                            if (lastY !== -1 && Math.abs(currentY - lastY) > (fontSize * 0.4)) {
                                fullText += textLine.trim() + '\n';
                                textLine = '';
                                lastX = -1;
                            }
                            
                            // Jika ada jarak antar kata (jarak X lebih besar dari 20% ukuran huruf)
                            if (lastX !== -1 && (currentX - lastX) > (fontSize * 0.2)) {
                                if (!textLine.endsWith(' ') && !item.str.startsWith(' ')) {
                                    textLine += ' ';
                                }
                            }
                            
                            textLine += item.str;
                            lastX = currentX + item.width;
                            lastY = currentY;
                        });
                        fullText += textLine.trim() + '\n';
                    }

                    // Bersihkan spasi ganda yang tidak wajar
                    fullText = fullText.replace(/ {2,}/g, ' ');

                    // Simpan hasil ke memory HP/Laptop
                    localStorage.setItem('savedPdfData', fullText);
                    
                    document.getElementById('pdfInput').value = fullText;
                    document.getElementById('fileLabel').innerText = `✅ Selesai: ${file.name}`;
                    document.getElementById('generateBtn').classList.remove('hidden');
                    parseText(); 
                } catch (error) {
                    alert('Gagal membaca file PDF. Pastikan file valid.');
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function clearAll() {
            // Hapus memory saat tombol Reset ditekan
            localStorage.removeItem('savedPdfData');
            
            document.getElementById('pdfFile').value = '';
            document.getElementById('fileLabel').innerText = 'Klik di sini atau seret file PDF ke sini';
            document.getElementById('pdfInput').value = '';
            document.getElementById('calendarOutput').innerHTML = '<p class="text-slate-400 text-sm italic text-center py-8">Belum ada file PDF yang diunggah.</p>';
            document.getElementById('copyAllBtn').classList.add('hidden');
            document.getElementById('generateBtn').classList.add('hidden');
        }

        function parseText() {
            const rawText = document.getElementById('pdfInput').value;
            const outputDiv = document.getElementById('calendarOutput');
            const copyAllBtn = document.getElementById('copyAllBtn');

            if (!rawText.trim()) return;

            const rawLines = rawText.split('\n');
            let cleanedLines = [];
            
            rawLines.forEach(line => {
                let trimmed = line.trim().replace(/ {2,}/g, ' '); // Bersihkan spasi berlebih per baris
                if (!trimmed) return;

                const isNewItem = /^(?:\d+\.|\b[a-z]\.)\s+/i.test(trimmed) || 
                                  /^(Senin|Selasa|Rabu|Kamis|Jumat|Sabtu|Ahad|Minggu)/i.test(trimmed) ||
                                  /^(4s|L|S|P|PPG|FKKI|FORSGI)\s*[:\.]/i.test(trimmed) ||
                                  /^Page\s+\d+/i.test(trimmed);

                if (isNewItem || cleanedLines.length === 0) {
                    cleanedLines.push(trimmed);
                } else {
                    cleanedLines[cleanedLines.length - 1] += " " + trimmed;
                }
            });

            let structuredDays = [];
            let generalSections = []; 
            let currentDayObj = null;
            let currentSectionObj = null;

            cleanedLines.forEach(line => {
                if (/^Page\s+\d+/i.test(line)) return;

                const dayMatch = /^(?:\d+\.\s*)?(Senin|Selasa|Rabu|Kamis|Jumat|Sabtu|Ahad|Minggu)/i.test(line);
                const sectionMatch = line.match(/^(4s|L|S|P|PPG|FKKI|FORSGI)\s*[:\.]/i);

                if (sectionMatch) {
                    if (currentDayObj) {
                        structuredDays.push(currentDayObj);
                        currentDayObj = null; 
                    }
                    
                    let titleText = sectionMatch[1].toUpperCase().replace('.', ':');
                    if (!titleText.endsWith(':')) titleText += ':';

                    currentSectionObj = {
                        title: titleText,
                        items: []
                    };
                    generalSections.push(currentSectionObj);
                    
                    let remainder = line.substring(sectionMatch[0].length).trim();
                    if (remainder) {
                        currentSectionObj.items.push(remainder.replace(/^\d+\.\s*/, ''));
                    }
                } 
                else if (dayMatch && (line.includes('/') || line.includes(','))) {
                    if (currentDayObj) structuredDays.push(currentDayObj);
                    currentDayObj = {
                        title: line.replace(/^[0-9]+\.\s*/, ''),
                        events: []
                    };
                    currentSectionObj = null; 
                } 
                else if (currentSectionObj) {
                    let cleanItem = line.replace(/^\d+\.\s*/, '').replace(/^[a-z]\.\s*/i, '');
                    if (/^\d+\./.test(line) || /^[a-z]\./i.test(line) || currentSectionObj.items.length === 0) {
                        currentSectionObj.items.push(cleanItem);
                    } else {
                        currentSectionObj.items[currentSectionObj.items.length - 1] += " " + cleanItem;
                    }
                } 
                else if (currentDayObj) {
                    let formattedEvent = line.replace(/^[a-z]\.\s*/i, '').replace(/^\d+\.\s*/, '');
                    currentDayObj.events.push(formattedEvent);
                }
            });

            if (currentDayObj) structuredDays.push(currentDayObj);

            if (structuredDays.length === 0 && generalSections.length === 0) {
                outputDiv.innerHTML = '<p class="text-red-500 text-sm text-center py-4">Format dokumen PDF tidak dikenali secara otomatis.</p>';
                copyAllBtn.classList.add('hidden');
                return;
            }

            let htmlContent = '';
            
            // Render Jadwal Harian
            structuredDays.forEach((day) => {
                let dayNameOnly = day.title.split(',')[0].trim();
                let eventTextForCopy = `Assalamualaikum wr wb\nKegiatan amrin jami' pada hari ${dayNameOnly} :\n\n`;
                eventTextForCopy += `*${day.title}*\n`;
                day.events.forEach((ev, idx) => {
                    eventTextForCopy += `${idx + 1}. ${ev}\n`;
                });
                eventTextForCopy += `\nAlhamdulilahi jazakumullahu khoiro\nWassalamualaikum wr wb`;
                
                htmlContent += `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 relative mb-4">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-blue-700 text-base">📌 ${day.title}</h3>
                            <button onclick="copyText(this)" data-content="${encodeURIComponent(eventTextForCopy.trim())}" class="bg-white hover:bg-blue-50 text-blue-600 border border-blue-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
                                📋 Salin Hari Ini
                            </button>
                        </div>
                        <ol class="space-y-2 text-sm text-slate-700 pl-4 list-decimal">
                            ${day.events.map(ev => `<li class="pl-1 leading-relaxed">${ev}</li>`).join('')}
                        </ol>
                    </div>
                `;
            });

            // Render Kategori Khusus (4s, L, P, dll)
            generalSections.forEach((sec) => {
                let secTextForCopy = `Assalamualaikum wr wb\nKegiatan amrin jami' bagian *${sec.title.replace(':','')}* :\n\n`;
                secTextForCopy += `*${sec.title}*\n`;
                sec.items.forEach((item, idx) => {
                    secTextForCopy += `${idx + 1}. ${item}\n`;
                });
                secTextForCopy += `\nAlhamdulilahi jazakumullahu khoiro\nWassalamualaikum wr wb`;

                htmlContent += `
                    <div class="bg-amber-50/60 border border-amber-200 rounded-xl p-4 relative mb-4">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-amber-800 text-base">📌 Catatan Khusus: ${sec.title}</h3>
                            <button onclick="copyText(this)" data-content="${encodeURIComponent(secTextForCopy.trim())}" class="bg-white hover:bg-amber-50 text-amber-700 border border-amber-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
                                📋 Salin Bagian Ini
                            </button>
                        </div>
                        <ol class="space-y-2 text-sm text-slate-700 pl-4 list-decimal">
                            ${sec.items.map(item => `<li class="pl-1 leading-relaxed">${item}</li>`).join('')}
                        </ol>
                    </div>
                `;
            });

            outputDiv.innerHTML = htmlContent;
            copyAllBtn.classList.remove('hidden');
        }

        function copyText(button) {
            const text = decodeURIComponent(button.getAttribute('data-content'));
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = '✅ Berhasil Disalin!';
                setTimeout(() => button.innerHTML = originalText, 2000);
            });
        }

        function copyAllSchedule() {
            let allText = `Assalamualaikum wr wb\nKegiatan amrin jami' :\n\n`;
            
            const outputDivs = document.querySelectorAll('#calendarOutput > div');
            outputDivs.forEach(div => {
                const title = div.querySelector('h3').innerText.replace('📌 ', '').replace('Catatan Khusus: ', '');
                allText += `*${title}*\n`;
                
                const listItems = div.querySelectorAll('ol > li');
                listItems.forEach((li, index) => {
                    allText += `${index + 1}. ${li.innerText}\n`;
                });
                allText += `\n`;
            });

            allText += `Alhamdulilahi jazakumullahu khoiro\nWassalamualaikum wr wb`;

            navigator.clipboard.writeText(allText.trim()).then(() => {
                const btn = document.getElementById('copyAllBtn');
                const orig = btn.innerHTML;
                btn.innerHTML = '✅ Semua Disalin!';
                setTimeout(() => btn.innerHTML = orig, 2000);
            });
        }
    </script>
</body>
</html>
