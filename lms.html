function normJ(j){if(!j||typeof j!=='object')return j;for(const k of Object.keys(j)){const lk=k.toLowerCase().replace(/[\s_\-]+/g,'');j[lk]=j[k]}return j}
function fmtDS(iso){
  if(!iso)return'-'; let str = String(iso); if(str.includes('T')) str = str.split('T')[0];
  let p = str.split('-');
  if(p.length===3){ const bl=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return parseInt(p[2])+' '+bl[parseInt(p[1])-1]+' '+p[0]; }
  return iso;
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function drP(u){if(!u)return '';if(u.includes('drive.google.com')){let m=u.match(/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;return u.replace(/\/view(\?|$)/,'/preview$1').replace(/\/edit(\?|$)/,'/preview$1')}return u}

async function api(a,d={}){
  d.action=a; const k=JSON.stringify({a,d}); const isMut=_sk.includes(a);
  if(!isMut&&_c[k]) return _c[k];
  const gl = document.getElementById('glLoader');
  document.getElementById('glLoaderText').textContent = (d.fileData && d.fileData.base64) ? "Mengunggah..." : "Memproses...";
  gl.style.display='flex';
  try{
    const r=await fetch(SU,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});
    const j=await r.json(); if(!isMut)_c[k]=j; gl.style.display='none'; return j;
  }catch(e){ gl.style.display='none'; return{success:false,message:'Koneksi gagal'} }
}

function renderChart(id, data, statusField, presentValue){
    const ctx = document.getElementById(id); if(!ctx) return;
    const counts = {};
    data.forEach(d=>{ 
        let dt = (d.Tanggal||d.tanggal||'').split('T')[0]; if(!dt) return;
        if(!counts[dt]) counts[dt]=0;
        if(d[statusField] === presentValue) counts[dt]++; 
    });
    const lbls = Object.keys(counts).sort(); const dts = lbls.map(l=>counts[l]);
    new Chart(ctx, { type:'line', data:{ labels:lbls.map(fmtDS), datasets:[{label:'Jumlah Hadir', data:dts, borderColor:'#1D4ED8', tension:0.3, fill:true, backgroundColor:'rgba(29,78,216,0.1)'}] } });
}

  doc.setFontSize(10);doc.setFont('helvetica','normal'); doc.text('PKBM Baitul Hikmah', pw/2, y+12, {align:'center'}); y+=22;
  doc.setDrawColor(0);doc.setLineWidth(0.5);doc.line(15, y, pw-15, y); y+=8;

  doc.setFontSize(9);

  previewPdf(doc,'Rapor_Akademik_'+nama.replace(/\s+/g,'_')+'.pdf');
}

async function cetakRaporKarakter(email, nama, nisn, kelas) {
  const [rt, rn, profil] = await Promise.all([api('getTargetKarakter',{semester:A.sess.semester, kelas: kelas}), api('getNilaiKarakter',{emailSiswa:email,semua:true,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran}), getProfilDefault()]);
  const tG = rt.success ? (rt.dataGuru || []).map(normJ) : []; const tO = rt.success ? (rt.dataOrtu || []).map(normJ) : []; const nilais = rn.success ? rn.data.map(normJ) : [];
  
  const{jsPDF}=window.jspdf; const doc=new jsPDF('p','mm','a4'); const pw=210,ph=297,ml=15,mr=15; let y=15;
  if (LOGO_B64) try { doc.addImage(LOGO_B64, 'JPEG', 15, y-2, 18, 18); } catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(14); doc.text('Laporan Penilaian Karakter Siswa', pw/2, y+6, {align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal'); doc.text('Atomic School', pw/2, y+12, {align:'center'}); y+=22;
  doc.setDrawColor(0);doc.setLineWidth(0.5);doc.line(15, y, pw-15, y); y+=8;

  doc.setFontSize(9);
  doc.text('Nama Siswa : '+nama, ml, y); doc.text('NISN : '+(nisn||'-'), ml, y+5); doc.text('Semester : '+A.sess.semester, pw/2+20, y); doc.text('Tahun Ajaran: '+A.sess.tahunPelajaran, pw/2+20, y+5); y+=18;

  doc.setFont('helvetica','bold'); doc.text('A. Penilaian Karakter oleh Guru (Skala 1-4)', ml, y); y+=4;
  let tbG = [];
  tG.forEach((t, i) => {
    let idT = t.id || t.idkarakter; let nObj = nilais.find(n => String(n.idtarget) === String(idT) && String(n.penilai).toLowerCase() === 'guru'); 
    let v = nObj ? nObj.nilai : '-'; let lbl = v==1?'Perlu Bimbingan':v==2?'Mulai Berkembang':v==3?'Sesuai Harapan':v==4?'Sangat Berkembang':'-';
    tbG.push([i+1, t.bidang || '-', t.target || '-', v, lbl]);
  });
  doc.autoTable({startY: y, head: [['No', 'Bidang', 'Target', 'Nilai', 'Keterangan']], body: tbG, theme: 'grid', styles:{fontSize:8}});

  y = doc.lastAutoTable.finalY + 15; doc.setFont('helvetica','bold'); doc.text('B. Penilaian Karakter oleh Orang Tua', ml, y); y+=4;
  let tbO = [];
  tO.forEach((t, i) => {
    let idT = t.id || t.idkarakter; let nObj = nilais.find(n => String(n.idtarget) === String(idT) && String(n.penilai).toLowerCase().includes('ortu'));
    let v = nObj ? nObj.nilai : '-'; let lbl = v==1?'Perlu Bimbingan':v==2?'Mulai Berkembang':v==3?'Sesuai Harapan':v==4?'Sangat Berkembang':'-';
    tbO.push([i+1, t.target || '-', v, lbl]);
  });
  doc.autoTable({startY: y, head: [['No', 'Target Sikap', 'Nilai', 'Keterangan']], body: tbO, theme: 'grid', styles:{fontSize:8}});
  
  y = doc.lastAutoTable.finalY + 15; if(y > ph-55) { doc.addPage(); y = 20; }
  doc.setFont('helvetica','normal'); doc.text('Orang Tua/Wali,', ml+10, y); doc.text('Wali Kelas,', pw-mr-50, y); doc.text('____________________', ml+10, y+22); doc.text(profil.walikelas || '____________________', pw-mr-50, y+22);
  y += 32; if(y > ph-35) { doc.addPage(); y = 20; }
  doc.text('Mengetahui,', pw/2, y, {align:'center'}); doc.text('Kepala Sekolah', pw/2, y+5, {align:'center'}); doc.text(profil.kepalasekolah || '____________________', pw/2, y+25, {align:'center'});

  previewPdf(doc,'Rapor_Karakter_'+nama.replace(/\s+/g,'_')+'.pdf');
}
