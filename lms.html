function normJ(j){if(!j||typeof j!=='object')return j;for(const k of Object.keys(j)){const lk=k.toLowerCase().replace(/[\s_\-]+/g,'');j[lk]=j[k]}return j}
function fmtDS(iso){
  if(!iso)return'-';
  let str = String(iso); if(str.includes('T')) str = str.split('T')[0];
  let p = str.split('-');
  if(p.length===3){
      const bl=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return parseInt(p[2])+' '+bl[parseInt(p[1])-1]+' '+p[0];
  }
  return iso;
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function drP(u){if(!u)return '';if(u.includes('drive.google.com')){let m=u.match(/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m)return`https://drive.google.com/file/d/${m[1]}/preview`;return u.replace(/\/view(\?|$)/,'/preview$1').replace(/\/edit(\?|$)/,'/preview$1')}return u}
function so(a,s='',p='-- Pilih --'){return `<option value="">${p}</option>`+a.map(o=>{const v=typeof o==='string'?o:o.v,l=typeof o==='string'?o:o.l;return `<option value="${v}" ${v==s?'selected':''}>${l}</option>`}).join('')}
function soK(a,s='',p='-- Pilih --'){return `<option value="">${p}</option>`+a.map(o=>`<option value="${o}" ${o==s?'selected':''}>${o}</option>`)+`<option value="__new__" style="color:var(--y3);font-weight:600">+ Tambah Baru</option>`}
function invCache(actions){for(const k in _c){for(const a of actions){if(k.includes('"'+a+'"')){delete _c[k];break}}}}

function toast(m,t='success'){const e=document.getElementById('toast'),ic=document.getElementById('tIc'),ms=document.getElementById('tMs');e.style.background=t==='error'?'#EF4444':t==='warning'?'#F59E0B':'#1D4ED8';ic.className='fas '+(t==='error'?'fa-times-circle':t==='warning'?'fa-exclamation-triangle':'fa-check-circle');ms.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3000)}
function sk(h=12){return `<div class="sk" style="height:${h}px;margin-bottom:7px"></div><div class="sk" style="height:${h}px;margin-bottom:7px;width:70%"></div><div class="sk" style="height:${h}px;width:50%"></div>`}
function skC(){return '<div class="cd mb-3">'+sk()+'</div>'}
function empty(ic,m){return `<div class="text-center py-12 fi-in"><div class="w-16 h-16 rounded-2xl mx-auto mb-3 flex items-center justify-center" style="background:var(--gxxl)"><i class="fas ${ic} text-2xl" style="color:var(--g4)"></i></div><p class="text-sm font-500" style="color:var(--tx3)">${m}</p></div>`}
function st(ic,l,v,c1='var(--g1)'){return `<div class="sc fi-in"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${c1}"><i class="fas ${ic} text-white text-sm"></i></div><div><p class="text-[11px] font-500" style="color:var(--tx3)">${l}</p><p class="text-lg font-h font-800 leading-tight" style="color:var(--tx)">${v}</p></div></div></div>`}

function clM(){document.getElementById('modal').classList.remove('on')}
function opV(ti,u){document.getElementById('vTi').textContent=ti;document.getElementById('vIf').src=u;document.getElementById('viewer').classList.add('on')}

function previewPdf(d,f){const u=URL.createObjectURL(d.output('blob'));document.getElementById('pdfTi').textContent='Preview: '+f;document.getElementById('pdfPreview').innerHTML=`<iframe src="${u}" style="width:100%;height:100%;border:none;border-radius:8px"></iframe>`;document.getElementById('pdfDlBtn').onclick=()=>d.save(f);document.getElementById('pdfModal').classList.add('on')}

async function toBase64(file){return new Promise((resolve, reject) => {const reader = new FileReader();reader.readAsDataURL(file);reader.onload = () => resolve(reader.result);reader.onerror = e => reject(e);});}

async function api(a,d={}){
  d.action=a; const k=JSON.stringify({a,d}); const isMut=_sk.includes(a);
  if(!isMut&&_c[k]) return _c[k];
  const gl = document.getElementById('glLoader');
  document.getElementById('glLoaderText').textContent = (d.fileData && d.fileData.base64) ? "Mengunggah..." : "Memproses...";
  gl.style.display='flex';
  try{
    const r=await fetch(SU,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});
    const j=await r.json(); if(!isMut)_c[k]=j; gl.style.display='none'; return j;
  }catch(e){ gl.style.display='none'; return{success:false,message:'Koneksi gagal'} }
}

  const eml = isOrtu ? A.u.EmailAnak : A.u.Email; const kls = isOrtu ? A.u.KelasAnak : A.u.Kelas;
  
  if(isGlobalMonitor) {
    const [rU, rK] = await Promise.all([api('getSiswaByKelas',{kelas:'__ALL__'}), api('getKelasList')]);
    const users = rU.success ? rU.data : [];
    let h=`<div class="fi-in"><h1 class="font-h font-800 text-xl mb-0.5">Dashboard ${A.u.Role}</h1><p class="text-xs mb-5" style="color:var(--tx3)">${td()} | Data Keseluruhan Sekolah</p><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">`;
    h+=st('fa-users','Siswa',users.filter(u=>u.Role==='Siswa').length,'var(--g1)');
    h+=st('fa-chalkboard-user','Guru',users.filter(u=>u.Role==='Guru').length,'var(--y1)');
    h+=st('fa-user-group','Orang Tua',users.filter(u=>u.Role==='Orang Tua').length,'var(--g4)');
    h+=st('fa-door-open','Kelas',rK.success ? rK.data.length : 0,'#EF4444');

  }

  invCache(['getStats','getProgress']);
  const r=await api('getStats',{role: isOrtu ? 'Siswa' : A.u.Role, email: eml, kelas: kls});
  if(!r.success)return empty('fa-triangle-exclamation',r.message);
  const s=r.data; let tName = A.u.Nama.split(' ')[0]; if(isOrtu) tName += ` (Wali dari ${A.u.NamaAnak})`;
  let h=`<div class="fi-in"><h1 class="font-h font-800 text-xl mb-0.5">Selamat datang, ${tName}</h1><p class="text-xs mb-5" style="color:var(--tx3)">${td()} | SMT ${A.sess.semester} - TP ${A.sess.tahunPelajaran}</p><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">`;
  if(A.u.Role==='Siswa' || isOrtu){
    h+=st('fa-book-open','Total Materi',s.totalMateri,'var(--g1)'); h+=st('fa-circle-check','Selesai',s.materiSelesai,'var(--y1)'); h+=st('fa-file-lines','Tugas',s.tugasDikumpulkan,'var(--g4)'); h+=st('fa-pen-to-square','Rata Kuis',s.rataKuis,'var(--y3)');
    h+=`</div><div class="cd"><div class="flex items-center justify-between mb-2.5"><h3 class="font-h font-700 text-sm">Progress Materi ${isOrtu?'Anak':''}</h3><span class="text-xs font-700" style="color:var(--g1)">${s.persenProgress}%</span></div><div class="w-full h-3 rounded-full overflow-hidden" style="background:var(--gxxl)"><div class="h-full rounded-full transition-all" style="background:linear-gradient(90deg,var(--g1),var(--y1));width:${s.persenProgress}%"></div></div></div>`;
  }else{
    h+=st('fa-users','Siswa',s.totalSiswa,'var(--g1)'); h+=st('fa-book','Mapel',s.totalMapel,'var(--y1)'); h+=st('fa-file-lines','Tugas',s.totalTugas,'var(--g4)'); h+=st('fa-clock','Belum Dinilai',s.belumDinilai,'#EF4444');
    h+=`</div>`;
    if(s.belumDinilai>0 && A.u.Role==='Guru')h+=`<div class="cd flex items-center gap-3 cursor-pointer hover:shadow-sm" style="border-color:var(--yl)" onclick="nav('penilaian')"><div class="w-10 h-10 rounded-xl flex items-center justify-center bg-yellow-100"><i class="fas fa-bell text-sm text-yellow-700"></i></div><div class="flex-1"><p class="text-sm font-600">${s.belumDinilai} tugas belum dinilai</p></div><i class="fas fa-chevron-right text-xs text-yellow-500"></i></div>`;
  }

async function smAMp(){
  let nama=document.getElementById('mpN_sel').value; if(nama==='__new__') nama = document.getElementById('mpN_inp').value.trim();
  if(!nama){toast('Nama mapel wajib','warning');return}
  let kList=[]; if(document.getElementById('mpAll').checked){kList=['Semua']}else{document.querySelectorAll('.mpKc:checked').forEach(c=>kList.push(c.value))}
  const newK = document.getElementById('mpNKList').value.split(',').map(x=>x.trim()).filter(Boolean); kList.push(...newK);
  if(!kList.length){toast('Pilih kelas','warning');return}
  let ok=0; for(const kelas of kList){const r=await api('addMapel',{namaMapel:nama,kelas});if(r.success)ok++}
  if(ok>0){clM();invCache(['getMapel','getKelasList']);toast(ok+' mapel ditambahkan');nav('kelola-mapel')}
}

async function smEMp(id){

/* ===== MODUL KELOLA CAPAIAN PEMBELAJARAN (CP) ===== */
async function pKelolaCP(){
  const [rm, rk, rc] = await Promise.all([api('getMapel'), api('getKelasList'), api('getCapaian', {semester: A.sess.semester})]);
  A.d.mapel = rm.success ? rm.data : []; 
  const kl = rk.success ? rk.data : [];
  const cpData = rc.success ? rc.data.map(normJ) : [];
  const mapelMap = {}; A.d.mapel.forEach(m => mapelMap[m.IDMapel] = m.NamaMapel);

  let tableHtml = '';
  if(!cpData.length){
    tableHtml = empty('fa-book-bookmark', 'Belum ada Capaian Pembelajaran untuk filter ini');
  } else {
    let h = `<table class="tb w-full"><thead><tr><th>Mapel</th><th>Kelas</th><th>Semester</th><th>Deskripsi Capaian Pembelajaran</th><th>Aksi</th></tr></thead><tbody>`;

    });
    tableHtml = h + `</tbody></table>`;
  }

  return `<div class="fi-in">
    <div class="flex justify-between items-center mb-5">
      <div><h1 class="font-h font-800 text-xl">Kelola Capaian Pembelajaran (CP)</h1><p class="text-xs text-slate-500">Input CP per mata pelajaran berdasarkan semester</p></div>
      <button class="bt bt1" onclick="mACp()"><i class="fas fa-plus"></i> Tambah CP</button>
    </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

    </div>
    <div class="cd" id="cpTableContainer">${tableHtml}</div>
  </div>`;

  const r = await api('getCapaian', {idMapel, kelas, semester});

  const mapelMap = {}; A.d.mapel.forEach(m => mapelMap[m.IDMapel] = m.NamaMapel);
  
  if(!data.length){ c.innerHTML = empty('fa-book-bookmark', 'Belum ada Capaian Pembelajaran untuk filter ini'); return; }

  data.forEach(d => {
    h += `<tr><td class="font-600">${mapelMap[d.idmapel] || d.idmapel}</td><td><span class="bd bg4">${d.kelas||'Semua'}</span></td><td><span class="bd bg2">Smt ${d.semester}</span></td><td>${d.deskripsicapaian}</td><td><div class="flex gap-1"><button class="ibtn" onclick="mECp('${d.id}','${d.idmapel}','${d.kelas}','${d.semester}','${esc(d.deskripsicapaian)}')"><i class="fas fa-pen"></i></button><button class="ibtn del" onclick="cfDel('Hapus CP ini?',async()=>{const res=await api('deleteCapaian',{id:'${d.id}'});if(res.success){toast('CP dihapus');ldCpTable()}else toast(res.message,'error')})"><i class="fas fa-trash"></i></button></div></td></tr>`;
  });
  c.innerHTML = h + `</tbody></table>`;

  api('getKelasList').then(r=>{

async function pNl(){
  const[rm,rt,rj]=await Promise.all([api('getMapel'),api('getTugas'),api('getJawabanTugas')]);
  A.d.mapel=rm.success?rm.data:[]; const tugas=rt.success?rt.data:[]; const jawaban=(rj.success?rj.data:[]).map(normJ);
  const mm={}; A.d.mapel.forEach(m=>mm[m.IDMapel]=m.NamaMapel);
  const ugCount={}; jawaban.forEach(j=>{const nv=j.nilai;if(nv===''||nv===null)ugCount[j.idtugas]=(ugCount[j.idtugas]||0)+1;});
  A._nl={tugas,jawaban,mm,ugCount,loaded:{}};
  return `<div class="fi-in"><h1 class="font-h font-800 text-xl mb-5">Penilaian Tugas</h1><select class="fi mb-3" id="nlF" onchange="nlFilter()"><option value="">Semua Mapel</option>${A.d.mapel.map(m=>`<option value="${m.IDMapel}">${m.NamaMapel}</option>`).join('')}</select><div id="nlC">${rNlCards(tugas,mm,ugCount)}</div></div>`;
}
function rNlCards(tugas,mm,ugCount){
  if(!tugas.length)return empty('fa-star','Belum ada tugas'); let h='';
  tugas.forEach(t=>{
    const ug=ugCount[t.IDTugas]||0; const mIds=String(t.IDMapel).split(',').map(x=>x.trim()); const mNames=mIds.map(id=>mm[id]||id).join(', ');
    h+=`<div class="cd mb-2 cursor-pointer" onclick="togNlSub('${t.IDTugas}')"><div class="flex justify-between items-center"><div class="flex-1"><div class="flex items-center gap-1.5 mb-1"><h3 class="font-h font-700 text-sm">${t.Judul}</h3><span class="bd bg1 truncate">${mNames}</span><span class="bd bg4">${t.Kelas}</span></div></div><div>${ug>0?`<span class="bd bg3">${ug} belum dinilai</span>`:`<span class="bd bgg">Selesai</span>`}</div></div></div><div id="nlS_${t.IDTugas}" class="hidden"></div>`;
  }); return h;
}
function nlFilter(){
  const fv=document.getElementById('nlF').value; let f=A._nl.tugas; if(fv) f=f.filter(t=>String(t.IDMapel).includes(fv));
  document.getElementById('nlC').innerHTML=rNlCards(f,A._nl.mm,A._nl.ugCount); A._nl.loaded={};

async function togNlSub(id){
  const sub=document.getElementById('nlS_'+id); if(!sub.classList.contains('hidden')){sub.classList.add('hidden');return;}
  sub.classList.remove('hidden'); if(A._nl.loaded[id])return; sub.innerHTML=`<div class="cd mb-2 bg-gray-50">${sk(10)}</div>`;
  const jw=A._nl.jawaban.filter(j=>String(j.idtugas)===String(id)); A._nl.loaded[id]=true;
  if(!jw.length){sub.innerHTML=`<div class="cd mb-2 bg-gray-50"><p class="text-xs text-center text-gray-500">Belum ada pengumpulan</p></div>`;return;}
  let h=`<div class="cd mb-2 bg-gray-50" style="padding:16px"><div class="space-y-2">`;
  jw.forEach(j=>{
    const isGraded=j.nilai!==''&&j.nilai!==null;

  const[rt,rn]=await Promise.all([
    api('getTargetKarakter',{semester:A.sess.semester, kelas:kelas, bulan:bulan}),
    api('getNilaiKarakter',{emailSiswa:email,semua:true,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran,bulan:bulan})
  ]);
  const targets = (type==='Guru') ? (rt.success?rt.dataGuru.map(normJ):[]) : (rt.success?rt.dataOrtu.map(normJ):[]);
  const nilais=rn.success?rn.data.map(normJ):[];
  let h=`<div class="cd"><h3 class="font-h font-700 text-sm mb-2">Penilaian Karakter (${type})</h3><table class="tb"><tbody>`;
  if(!targets.length){
    h+=`<tr><td colspan="2" class="text-center text-gray-500 py-4">Belum ada target karakter untuk kategori ini.</td></tr>`;
  } else {
    targets.forEach(t=>{
      const idT=t.id||t.idkarakter; 
      const v=nilais.find(n=>String(n.idtarget)===String(idT)&&n.penilai===type)?.nilai;
      h+=`<tr><td>${t.target}</td><td><div class="flex gap-2">`;
      [1,2,3,4].forEach(n=>h+=`<label><input type="radio" name="kar_${idT}" value="${n}" ${v==n?'checked':''}>${n}</label>`); 
      h+=`</div></td></tr>`;
    });
  }
  area.innerHTML=h+`</tbody></table><button class="bt bt1 mt-3" onclick="svKg()">Simpan</button></div>`;
}
async function svKg(){
  const type=document.getElementById('kgType').value;
  const bulan = type==='Ortu' ? document.getElementById('kgB').value : '';
  const list=[]; document.querySelectorAll('#kgFormArea input[type="radio"]:checked').forEach(i=>list.push({idTarget:i.name.replace('kar_',''),nilai:i.value}));
  const r=await api('submitKarakter',{emailSiswa:document.getElementById('kgS').value,type:type,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran,bulan:bulan,list});
  if(r.success){invCache(['getNilaiKarakter']);toast('Tersimpan')}
}

async function pSPPAnak(){
  const r = await api('getSPP');
  if(!r.success) return empty('fa-exclamation', r.message);
  const data = r.data.map(normJ).filter(d => d.emailsiswa === A.u.EmailAnak);
  
  let t = `<table class="tb w-full"><thead><tr><th>Tanggal</th><th>Bulan</th><th>Nominal</th><th>Status / Bukti</th></tr></thead><tbody>`;
  if(!data.length){
    t += `<tr><td colspan="4" class="text-center text-gray-500 py-4">Belum ada riwayat pembayaran SPP untuk ${A.u.NamaAnak}</td></tr>`;
  } else {
    data.forEach(d => {
      t += `<tr><td>${fmtDS(d.tanggal)}</td><td class="font-600">${d.bulan}</td><td>Rp ${Number(d.nominal).toLocaleString('id-ID')}</td><td>${d.buktiurl ? `<a href="${d.buktiurl}" target="_blank" class="text-blue-600 underline">Lihat Bukti</a>` : '<span class="text-green-600 font-600">Lunas / Tercatat</span>'}</td></tr>`;
    });
  }
  t += `</tbody></table>`;
  return `<div class="fi-in"><h1 class="font-h font-800 text-xl mb-5">Riwayat Pembayaran SPP Anak (${A.u.NamaAnak})</h1><div class="cd">${t}</div></div>`;
}

async function pTr(){
  const email = A.u.Role === 'Orang Tua' ? A.u.EmailAnak : A.u.Email;
  const nama = A.u.Role === 'Orang Tua' ? A.u.NamaAnak : A.u.Nama;
  const kls = A.u.Role === 'Orang Tua' ? A.u.KelasAnak : A.u.Kelas;
  const nisn = A.u.NISN || ''; 
  return `<div class="fi-in"><h1 class="font-h font-800 text-xl mb-5">Rapor dan Transkrip</h1><div class="flex gap-3"><button class="bt bt1" onclick="cetakRaporAkademik('${email}','${esc(nama)}','${kls}','${nisn}')">Unduh Rapor Akademik</button><button class="bt bty" onclick="cetakRaporKarakter('${email}','${esc(nama)}','${nisn}','${kls}')">Unduh Rapor Karakter</button></div></div>`;
}
async function pTK(){
  const rk=await api('getKelasList');
  return `<div class="fi-in"><h1 class="font-h font-800 text-xl mb-5">Cetak Rapor Siswa</h1><div class="cd mb-3"><div class="flex gap-3 items-end"><div class="flex-1"><label class="fl">Kelas</label><select id="tkK" class="fi">${so(rk.success?rk.data:[])}</select></div><button class="bt bt1" onclick="ldTK()">Muat Siswa</button></div></div><div id="tkC"></div></div>`;
}
async function ldTK(){
  const k=document.getElementById('tkK').value, c=document.getElementById('tkC'); if(!k)return; c.innerHTML=skC();
  const rs=await api('getSiswaByKelas',{kelas:k}); const siswa=rs.success?rs.data.filter(u=>u.Role==='Siswa'):[];
  let h=`<div class="cd"><table class="tb"><thead><tr><th>Nama Siswa</th><th>NISN</th><th>Aksi Rapor</th></tr></thead><tbody>`;
  siswa.forEach(s=>{ h+=`<tr><td class="font-600">${s.Nama}</td><td class="text-xs">${s.NISN||'-'}</td><td><button class="bt bt1 bts mr-1" onclick="cetakRaporAkademik('${s.Email}','${esc(s.Nama)}','${k}','${s.NISN||''}')">Akademik</button><button class="bt bty bts" onclick="cetakRaporKarakter('${s.Email}','${esc(s.Nama)}','${s.NISN||''}','${k}')">Karakter</button></td></tr>`; });
  c.innerHTML=h+`</tbody></table></div>`;
}

async function getProfilDefault(){
  const r = await api('getProfilSekolah');
  if(r.success && r.data.length > 0) return normJ(r.data[0]);
  return {namasekolah:'Atomic School', alamat:'Jl. Pendidikan', kepalasekolah:'Kepala Sekolah', walikelas:'Wali Kelas'};
}

/* ===== INTEGRASI CAPAIAN KOMPETENSI KE RAPOR AKADEMIK (PDF) ===== */
async function cetakRaporAkademik(email, nama, kelas, nisn) {
  const [rT, rC, rM, profil] = await Promise.all([api('getTranskrip',{email,kelas}), api('getCapaian',{semester: A.sess.semester}), api('getMapel'), getProfilDefault()]);
  const transkrip = rT.success ? rT.data : []; 
  const capaianAll = rC.success ? rC.data.map(normJ) : [];
  const mapelList = rM.success ? rM.data.map(normJ) : [];
  const mapelNameToId = {};
  mapelList.forEach(m => { mapelNameToId[String(m.namamapel||m.NamaMapel||'').toLowerCase().trim()] = m.idmapel || m.IDMapel; });
  
  const{jsPDF}=window.jspdf; const doc=new jsPDF('p','mm','a4'); const pw=210,ph=297,ml=15,mr=15; let y=15;
  if (LOGO_B64) try { doc.addImage(LOGO_B64, 'JPEG', 15, y-2, 18, 18); } catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(14); doc.text('Laporan Hasil Belajar (Rapor)', pw/2, y+6, {align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal'); doc.text(profil.namasekolah || 'Atomic School', pw/2, y+12, {align:'center'}); y+=22;
  doc.setDrawColor(0);doc.setLineWidth(0.5);doc.line(15, y, pw-15, y); y+=8;

  doc.setFontSize(9);
  doc.text('Nama : '+nama, ml, y); doc.text('NISN : '+(nisn||'-'), ml, y+5); doc.text('Sekolah : '+(profil.namasekolah||'Sekolah'), ml, y+10);
  doc.text('Kelas : '+kelas, pw/2+20, y); doc.text('Semester : '+A.sess.semester, pw/2+20, y+5); doc.text('Tahun Ajaran : '+A.sess.tahunPelajaran, pw/2+20, y+10); y+=20;
  
  doc.setFont('helvetica','bold'); doc.text('A. NILAI DAN KETERCAPAIAN KOMPETENSI', ml, y); y+=4;
  let tb = []; 
  transkrip.forEach((t) => {
    if(String(t.namaMapel).toLowerCase().includes('phbl')) return;
    const targetMapelId = mapelNameToId[String(t.namaMapel).toLowerCase().trim()];
    let cap = capaianAll.find(c => (String(c.idmapel) === String(targetMapelId) || String(c.matapelajaran||'').toLowerCase().trim() === String(t.namaMapel).toLowerCase().trim()) && (String(c.semester) === String(A.sess.semester) || String(c.semester) === 'Semua'));
    tb.push([tb.length+1, t.namaMapel, t.nilaiAkhir, cap ? (cap.deskripsicapaian || cap.deskripsiCapaian) : 'Siswa telah menunjukkan penguasaan kompetensi yang baik pada mata pelajaran ini.']);
  });
  doc.autoTable({startY: y, head: [['No', 'Mata Pelajaran', 'Nilai', 'Capaian Kompetensi']], body: tb, theme: 'grid', styles:{fontSize:8}});

  y = doc.lastAutoTable.finalY + 15;
  if(y > ph-55) { doc.addPage(); y = 20; }
  
  // Posisi Tanda Tangan: Wali Kelas & Orang Tua di atas (kiri & kanan), Kepala Sekolah di bawah tepat di tengah
  doc.setFont('helvetica','normal');
  doc.text('Orang Tua/Wali,', ml+10, y); 
  doc.text('Wali Kelas,', pw-mr-50, y); 
  doc.text('____________________', ml+10, y+22);
  doc.text(profil.walikelas || '____________________', pw-mr-50, y+22);
  
  y += 32;
  if(y > ph-35) { doc.addPage(); y = 20; }
  doc.text('Mengetahui,', pw/2, y, {align:'center'});
  doc.text('Kepala Sekolah', pw/2, y+5, {align:'center'}); 
  doc.text(profil.kepalasekolah || '____________________', pw/2, y+25, {align:'center'});

  previewPdf(doc,'Rapor_Akademik_'+nama.replace(/\s+/g,'_')+'.pdf');
}

async function cetakRaporKarakter(email, nama, nisn, kelas) {
  const [rt, rn, profil] = await Promise.all([api('getTargetKarakter',{semester:A.sess.semester, kelas: kelas}), api('getNilaiKarakter',{emailSiswa:email,semua:true,semester:A.sess.semester,tahunPelajaran:A.sess.tahunPelajaran}), getProfilDefault()]);
  const tG = rt.success ? (rt.dataGuru || []).map(normJ) : []; 
  const tO = rt.success ? (rt.dataOrtu || []).map(normJ) : []; 
  const nilais = rn.success ? rn.data.map(normJ) : [];
  
  const{jsPDF}=window.jspdf; const doc=new jsPDF('p','mm','a4'); const pw=210,ph=297,ml=15,mr=15; let y=15;

  if (LOGO_B64) try { doc.addImage(LOGO_B64, 'JPEG', 15, y-2, 18, 18); } catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(14); doc.text('Laporan Penilaian Karakter Siswa', pw/2, y+6, {align:'center'});
  doc.setFontSize(10);doc.setFont('helvetica','normal'); doc.text(profil.namasekolah || 'Atomic School', pw/2, y+12, {align:'center'}); y+=22;
  doc.setDrawColor(0);doc.setLineWidth(0.5);doc.line(15, y, pw-15, y); y+=8;

  doc.setFontSize(9);
  doc.text('Nama Siswa : '+nama, ml, y); doc.text('NISN : '+(nisn||'-'), ml, y+5); doc.text('Semester : '+A.sess.semester, pw/2+20, y); doc.text('Tahun Ajaran: '+A.sess.tahunPelajaran, pw/2+20, y+5); y+=18;

  doc.setFont('helvetica','bold'); doc.text('A. Penilaian Karakter oleh Guru (Skala 1-4)', ml, y); y+=4;
  let tbG = [];
  tG.forEach((t, i) => {
    let idT = t.id || t.idkarakter; 
    let nObj = nilais.find(n => String(n.idtarget) === String(idT) && String(n.penilai).toLowerCase() === 'guru'); 
    let v = nObj ? nObj.nilai : '-';
    let lbl = v==1?'Perlu Bimbingan':v==2?'Mulai Berkembang':v==3?'Berkembang Sesuai Harapan':v==4?'Sangat Berkembang':'-';
    tbG.push([i+1, t.bidang || '-', t.target || '-', v, lbl]);
  });
  doc.autoTable({startY: y, head: [['No', 'Bidang', 'Target', 'Nilai', 'Keterangan']], body: tbG, theme: 'grid', styles:{fontSize:8}});

  y = doc.lastAutoTable.finalY + 15;
  doc.setFont('helvetica','bold'); doc.text('B. Penilaian Karakter oleh Orang Tua', ml, y); y+=4;
  let tbO = [];
  tO.forEach((t, i) => {
    let idT = t.id || t.idkarakter; 
    let nObj = nilais.find(n => String(n.idtarget) === String(idT) && String(n.penilai).toLowerCase().includes('ortu'));
    let v = nObj ? nObj.nilai : '-';
    let lbl = v==1?'Perlu Bimbingan':v==2?'Mulai Berkembang':v==3?'Berkembang Sesuai Harapan':v==4?'Sangat Berkembang':'-';
    tbO.push([i+1, t.target || '-', v, lbl]);
  });
  doc.autoTable({startY: y, head: [['No', 'Target Sikap', 'Nilai', 'Keterangan']], body: tbO, theme: 'grid', styles:{fontSize:8}});
  
  y = doc.lastAutoTable.finalY + 15;
  if(y > ph-55) { doc.addPage(); y = 20; }
  
  doc.setFont('helvetica','normal');
  doc.text('Orang Tua/Wali,', ml+10, y); 
  doc.text('Wali Kelas,', pw-mr-50, y); 
  doc.text('____________________', ml+10, y+22);
  doc.text(profil.walikelas || '____________________', pw-mr-50, y+22);
  
  y += 32;
  if(y > ph-35) { doc.addPage(); y = 20; }
  doc.text('Mengetahui,', pw/2, y, {align:'center'});
  doc.text('Kepala Sekolah', pw/2, y+5, {align:'center'}); 
  doc.text(profil.kepalasekolah || '____________________', pw/2, y+25, {align:'center'});

  previewPdf(doc,'Rapor_Karakter_'+nama.replace(/\s+/g,'_')+'.pdf');
}
